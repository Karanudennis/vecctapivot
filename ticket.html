<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raise Ticket - VECCTAPIVOT</title>
<style>
body{background:#0f172a;color:#fff;font-family:system-ui;padding:16px;max-width:600px;margin:auto}
.card{background:#1e293b;padding:18px;border-radius:12px;border:1px solid #334155}
input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155;box-sizing:border-box}
button{padding:14px;border:none;border-radius:8px;font-weight:800;width:100%;cursor:pointer}
.btn-blue{background:#3b82f6;color:#fff}
label{font-size:13px;color:#94a3b8;display:block;margin-top:8px}
</style>
</head><body>
<h3 style="color:#3b82f6;text-align:center">Raise Ticket</h3>
<div class="card">
<label>JOB ID (linked)</label>
<input id="jobId" placeholder="JOB-20260911-XXXX">
<label>Your Question / Issue</label>
<textarea id="msg" rows="4" placeholder="Type your question about this job..."></textarea>
<button class="btn-blue" onclick="raiseTicket()">RAISE TICKET</button>
<div id="res"></div>
</div>

<script>
// Auto fill from URL ?job=JOB-xxx
let p=new URLSearchParams(window.location.search);
if(p.get('job')) document.getElementById('jobId').value=p.get('job');

function raiseTicket(){
 let jobId=document.getElementById('jobId').value.trim();
 let message=document.getElementById('msg').value.trim();
 if(!jobId||!message){alert('Enter JOB ID and message');return;}

 let tickets=JSON.parse(localStorage.getItem('veccta_tickets')||'[]');
 let t={
   id:'TICKET-'+Date.now(),
   jobId:jobId,
   message:message,
   from:'Client',
   adminReply:'',
   status:'Open',
   logged:new Date().toLocaleString()
 };
 tickets.push(t);
 localStorage.setItem('veccta_tickets',JSON.stringify(tickets));

 document.getElementById('res').innerHTML=`<div class=card style="border-left:4px solid #3b82f6;text-align:center"><b style="color:#3b82f6">${t.id}</b><br>Ticket raised for ${jobId}<br><br><a href="track.html" style="background:#3b82f6;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none">Go Track</a> <a href="https://wa.me/254788099685?text=${t.id} for ${jobId}" style="color:#25D366;font-weight:700;margin-left:10px">WhatsApp</a></div>`;
}
</script>
</body></html>
