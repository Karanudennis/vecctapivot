<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Raise Ticket</title>
<style>body{font-family:system-ui;background:#0f172a;color:white;padding:16px;max-width:600px;margin:auto}.card{background:#1e293b;padding:16px;border-radius:12px;border:1px solid #334155}input,textarea,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;background:#0f172a;color:white;border:1px solid #334155}button{width:100%;padding:12px;background:#3b82f6;color:white;font-weight:800;border:none;border-radius:10px}</style>
</head><body>
<h2>Raise Ticket - Consultation / Follow-up</h2>
<div class="card">
<input id="tPhone" placeholder="Your Phone">
<select id="tType"><option>Consultation - Uncertain about job</option><option>Follow-up - About existing JOB</option><option>General Inquiry</option></select>
<input id="tJobId" placeholder="If follow-up, enter JOB ID (optional)">
<textarea id="tMsg" placeholder="Your question... e.g., What docs needed for KRA PIN?"></textarea>
<button onclick="raiseTicket()">SUBMIT TICKET</button>
</div>
<script>
function raiseTicket(){
 let tickets=JSON.parse(localStorage.getItem('karanu_tickets')||'[]');
 let t={id:`TICKET-${Date.now()}`, phone:document.getElementById('tPhone').value,
  type:document.getElementById('tType').value, jobId:document.getElementById('tJobId').value||"General",
  message:document.getElementById('tMsg').value, adminReply:"", status:"Open", logged:new Date().toLocaleString()};
 tickets.push(t); localStorage.setItem('karanu_tickets',JSON.stringify(tickets));
 alert(`TICKET Created: ${t.id}`); location.href=`track.html?ticket=${t.id}`;
}
</script></body></html>
