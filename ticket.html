<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEC Ticket System - Full</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#f8fafc}
.top{background:#0f172a;color:#fff;padding:16px 20px;text-align:center}
.formBox{background:#fff;max-width:600px;margin:20px auto;padding:24px;border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
label{font-size:12px;font-weight:700;color:#334155;margin-top:14px;display:block}
input,select,textarea{width:100%;padding:13px;border:1.5px solid #e2e8f0;border-radius:12px;margin-top:6px;font-size:13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#0f172a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:14px;background:#f59e0b;color:#000;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:18px;font-size:14px}
.btn:disabled{background:#e2e8f0}
.ticketCard{margin-top:18px;background:#065f46;color:#fff;padding:18px;border-radius:14px;display:none}
.ticketCard.show{display:block}
.pill{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800}
</style>
</head>
<body>
<div class="top">
<h2>VECCTAPIVOT - Raise Ticket</h2>
<p style="font-size:11px;color:#94a3b8;margin-top:4px">TIC-XXXXX • Trackable • Admin Linked • Cloud</p>
</div>

<div class="formBox">
<label>Full Name *</label>
<input id="name" placeholder="Dennis Muthoni">

<div class="grid">
<div><label>Phone *</label><input id="phone" placeholder="0700000000"></div>
<div><label>Email</label><input id="email" placeholder="vec@gmail.com"></div>
</div>

<div class="grid">
<div><label>Category *</label>
<select id="pillar">
<option value="">Select Category</option>
<option>Academic & Testing Logistics</option>
<option>KRA Services</option>
<option>CV & Jobs</option>
<option>Government Services</option>
<option>Technical Support</option>
<option>Other</option>
</select></div>

<div><label>Priority</label>
<select id="priority"><option>Normal</option><option>High</option><option>Urgent</option></select></div>
</div>

<label>Sub-Category / Service *</label>
<select id="service">
<option value="">Select Service First</option>
</select>

<label>Issue Title *</label>
<input id="title" placeholder="e.g. ID Correction, KRA Pin not opening">

<label>Describe Issue in Detail *</label>
<textarea id="desc" rows="5" placeholder="Explain your issue... What happened? What do you need?"></textarea>

<button class="btn" id="submitBtn" onclick="createTicket()">🎫 CREATE TICKET - SAVE TO CLOUD</button>

<div id="successBox" class="ticketCard">
<h3 id="tId">TIC-00000</h3>
<p id="tInfo" style="font-size:12px;margin-top:8px"></p>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
<button onclick="trackNow()" style="padding:10px 16px;background:#fbbf24;border:none;border-radius:8px;font-weight:700;cursor:pointer">Track Now</button>
<button onclick="location.href='admin.html'" style="padding:10px 16px;background:#fff;color:#065f46;border:none;border-radius:8px;font-weight:700;cursor:pointer">View in Admin</button>
<button onclick="copyId()" style="padding:10px 16px;background:#10b981;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">Copy ID</button>
</div>
</div>

<p id="err" style="color:#dc2626;font-size:11px;margin-top:12px;text-align:center"></p>
</div>

<script>
const firebaseConfig={
  apiKey:"PUT_YOUR_API_KEY",
  authDomain:"PUT_YOUR_AUTH_DOMAIN",
  projectId:"PUT_YOUR_PROJECT_ID",
  storageBucket:"PUT_YOUR_BUCKET",
  messagingSenderId:"PUT_SENDER",
  appId:"PUT_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const services={
"Academic & Testing Logistics":["Revision Booklets - College","Exam Registration","Transcript Request"],
"KRA Services":["KRA Pin Registration","KRA Returns Filing","Compliance Check"],
"CV & Jobs":["CV Writing","Job Application","Interview Prep"],
"Government Services":["ID Correction","Birth Certificate","Good Conduct"],
"Technical Support":["System Not Working","Payment Issue","Login Problem"],
"Other":["General Inquiry","Complaint","Feedback"]
};

document.getElementById('pillar').onchange=function(){
  const v=this.value;
  const s=document.getElementById('service');
  s.innerHTML='<option>Select Service</option>';
  if(services[v]){services[v].forEach(x=>{let o=document.createElement('option'); o.textContent=x; s.appendChild(o);});}
};

let lastTicketId=null;

async function createTicket(){
  const btn=document.getElementById('submitBtn');
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const email=document.getElementById('email').value.trim();
  const pillar=document.getElementById('pillar').value;
  const service=document.getElementById('service').value;
  const title=document.getElementById('title').value.trim();
  const desc=document.getElementById('desc').value.trim();
  const priority=document.getElementById('priority').value;

  if(!name||!phone||!pillar||!service||!title||!desc){
    document.getElementById('err').innerText='Fill all * fields - Name, Phone, Category, Service, Title, Description';
    return;
  }

  btn.innerText='⏳ CREATING TICKET & SAVING TO FIREBASE...';
  btn.disabled=true;
  document.getElementById('err').innerText='';

  const ticketId="TIC-0"+Math.floor(4000+Math.random()*1000);
  lastTicketId=ticketId;

  const ticketData={
    trackingId:ticketId,
    ticket:ticketId,
    id:ticketId,
    ticketNumber:ticketId,
    clientName:name,
    name:name,
    phone:phone,
    email:email,
    pillar:pillar,
    category:pillar,
    subPillar:service,
    service:service,
    issue:title,
    title:title,
    description:desc,
    priority:priority,
    status:'queue',
    source:'ticket.html full system',
    adminMessage:'',
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    lastUpdated:firebase.firestore.FieldValue.serverTimestamp()
  };

  try{
    // SAVE TO BOTH COLLECTIONS - So both track.html and admin.html find it
    await db.collection("tickets").doc(ticketId).set(ticketData);
    await db.collection("jobs").doc(ticketId).set(ticketData);

    document.getElementById('successBox').classList.add('show');
    document.getElementById('tId').innerText=ticketId+' - CREATED & SAVED TO CLOUD';
    document.getElementById('tInfo').innerHTML=`<b>${name}</b> • ${phone}<br>${pillar} > ${service}<br>${title}<br><br>✅ This ticket is now visible in:<br>1. track.html?job=${ticketId}<br>2. admin.html (search ${ticketId})<br>3. Any device anywhere`;

    btn.innerText='✅ TICKET SAVED - CREATE ANOTHER';
    btn.disabled=false;

  }catch(e){
    btn.innerText='🎫 CREATE TICKET - SAVE TO CLOUD';
    btn.disabled=false;
    document.getElementById('err').innerHTML=`🔥 FIREBASE SAVE FAILED: ${e.message}<br><br>Go to Firebase Console → Firestore → Rules → Set to:<br><code>allow read, write: if true;</code><br>Publish and try again`;
    alert('Save Failed: '+e.message+'\n\nFix Firestore Rules');
  }
}

function trackNow(){
  if(lastTicketId) window.location.href='track.html?job='+lastTicketId;
}
function copyId(){
  if(lastTicketId){navigator.clipboard.writeText(lastTicketId); alert('Copied: '+lastTicketId);}
}
</script>
</body>
</html>
