<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VEC Admin Working</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px}
.card{background:#fff;padding:15px;margin-bottom:10px;border-radius:10px;box-shadow:0 1px 3px #ccc}
button{padding:8px 12px;background:#000;color:#fff;border:none;border-radius:6px;cursor:pointer}
input,textarea,select{width:100%;padding:8px;margin-top:5px;border:1px solid #ccc;border-radius:6px}
#box{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}
#box.show{display:flex}
#inner{background:#fff;padding:20px;width:400px;border-radius:12px}
</style>
</head>
<body>

<h2>VEC Admin - WORKING</h2>
<p id="count">Loading...</p>
<input id="search" placeholder="Search ID or phone" oninput="show()" style="max-width:300px">
<div id="list" style="margin-top:15px"></div>

<div id="box"><div id="inner">
<h3 id="bid"></h3>
<select id="bstatus">
<option value="queue">Queue</option>
<option value="in_progress">In Progress</option>
<option value="correction">Correction</option>
<option value="submitted">Ready</option>
<option value="closed">Closed</option>
</select>
<textarea id="bnote" rows="4" placeholder="Message client will see"></textarea>
<button onclick="save()" style="margin-top:10px;width:100%">SAVE - Show to Tracker</button>
<button onclick="document.getElementById('box').classList.remove('show')" style="margin-top:8px;width:100%;background:#ccc;color:#000">Cancel</button>
</div></div>

<script>
// === PUT YOUR REAL CONFIG HERE ===
const firebaseConfig = {
  apiKey: "YOURS",
  authDomain: "YOURS",
  projectId: "YOURS",
  storageBucket: "YOURS",
  messagingSenderId: "YOURS",
  appId: "YOURS"
};
// ================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allJobs = [];
let curId = null;
let curCol = null;

async function load(){
  try{
    const jobs = await db.collection("jobs").get();
    const tickets = await db.collection("tickets").get();
    allJobs = [];
    jobs.forEach(d=> allJobs.push({docId:d.id, col:"jobs", tracking:d.data().trackingId||d.id, ...d.data()}));
    tickets.forEach(d=> allJobs.push({docId:d.id, col:"tickets", tracking:d.data().trackingId||d.id, ...d.data()}));
    document.getElementById('count').innerText = allJobs.length + " jobs/tickets found";
    show();
  }catch(e){
    document.getElementById('count').innerText = "ERROR: " + e.message + " - Check Firestore Rules";
    console.error(e);
  }
}

function show(){
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = allJobs.filter(j=> !q || (j.tracking||'').toLowerCase().includes(q) || (j.phone||'').includes(q));
  document.getElementById('list').innerHTML = filtered.map(j=>`
    <div class="card">
      <b>${j.tracking}</b> - ${j.status||'no status'} - ${j.col}
      <div style="font-size:13px;margin:4px 0">${j.service||j.issue||''} | ${j.phone||''} | ${j.clientName||''}</div>
      <div style="font-size:12px;background:#f0f0f0;padding:5px;border-radius:5px">Note: ${j.adminMessage||'No note yet'}</div>
      <button onclick="openBox('${j.docId}','${j.col}')" style="margin-top:8px">Respond</button>
    </div>
  `).join('') || 'No jobs - Check if jobs collection exists';
}

function openBox(docId,col){
  const j = allJobs.find(x=>x.docId==docId && x.col==col);
  curId = docId; curCol = col;
  document.getElementById('bid').innerText = j.tracking;
  document.getElementById('bstatus').value = j.status||'queue';
  document.getElementById('bnote').value = j.adminMessage||'';
  document.getElementById('box').classList.add('show');
}

async function save(){
  const status = document.getElementById('bstatus').value;
  const note = document.getElementById('bnote').value;
  if(!note) return alert('Write note');
  await db.collection(curCol).doc(curId).update({
    status: status,
    adminMessage: note,
    adminResponseAt: new Date(),
    lastUpdated: new Date()
  });
  document.getElementById('box').classList.remove('show');
  load();
}

load();
</script>
</body>
</html>
