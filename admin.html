<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin GLOBAL — VECCTAPIVOT</title><style>body{background:#0f172a;color:#fff;font-family:system-ui;margin:0;padding:12px}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:12px;margin:10px 0}input,select,textarea{width:100%;padding:10px;margin:5px 0;border-radius:10px;background:#0f172a;color:#fff;border:1px solid #334155;box-sizing:border-box}.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:800;cursor:pointer}.gold{background:#facc15;color:#000}.well{padding:10px;border-radius:10px;margin:6px 0;border:2px solid}.g{border-color:#22c55e;background:#052e16}.r{border-color:#ef4444;background:#450a0a}.y{border-color:#facc15;background:#422006}</style></head><body>
<div id="login" class="card" style="max-width:400px;margin:40px auto;text-align:center"><h3 style="color:#facc15">Admin Login GLOBAL</h3><input id="pw" type="password" placeholder="veccta2024"><button class="btn gold" style="width:100%" onclick="login()">Login</button><div id="cloudSt" style="font-size:11px;color:#94a3b8;margin-top:8px">Firebase: vecctapivot</div></div>
<div id="panel" hidden><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="color:#facc15">GLOBAL Admin — <span id="cnt">0</span> jobs — <span id="st" style="font-size:12px;color:#22c55e">Cloud LIVE</span></h3><div><button class="btn gold" onclick="loadCloud()">↻ Cloud Refresh</button><a href="index.html" style="color:#94a3b8;margin-left:8px">Home</a></div></div><input id="q" placeholder="Search..." oninput="render()"><div id="list"></div></div>
<script type="module">
import { db } from './firebase.js';
import { collection, getDocs, doc, updateDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let JOBS=[];
window.login=()=>{if(pw.value==='veccta2024'){login.hidden=true; panel.hidden=false; loadCloud()}else alert('wrong')}
window.loadCloud=async()=>{
 try{st.textContent='Syncing...'; let snap=await getDocs(query(collection(db,'jobs'), orderBy('createdAt','desc'), limit(200))); JOBS=[]; snap.forEach(d=>{let o=d.data(); o._id=d.id; JOBS.push(o)}); cnt.textContent=JOBS.length; st.textContent=`Cloud LIVE - ${JOBS.length} jobs`; render()}catch(e){st.textContent='❌ '+e.message+' - Check Firestore Rules'; let local=JSON.parse(localStorage.getItem('veccta_jobs')||'[]'); JOBS=local; cnt.textContent=JOBS.length+' local'; render()}
}
window.render=()=>{let qv=(q.value||'').toLowerCase(); let list=JOBS.filter(j=>!qv||JSON.stringify(j).toLowerCase().includes(qv)); let h=''; list.forEach(j=>{h+=`<div class=card><b style="color:#facc15">${j.id}</b> ${j.status} — ${j.logged||''}<br><b>${j.fullService}</b><br><small>${j.clientName} ${j.clientPhone} · ${j.pillar}</small><br><b style="color:#facc15">${j.price?'KSH '+j.price:'No price'}</b><br><input id="p-${j.id}" value="${j.price||''}" placeholder="Price"><select id="s-${j.id}"><option ${j.status==='Logged'?'selected':''}>Logged</option><option ${j.status==='Quoted'?'selected':''}>Quoted</option><option ${j.status==='Paid'?'selected':''}>Paid</option><option ${j.status==='In Progress'?'selected':''}>In Progress</option><option ${j.status==='Done'?'selected':''}>Done</option><option ${j.status==='Revision Needed'?'selected':''}>Revision Needed</option></select><textarea id="m-${j.id}" rows=2 placeholder="Admin message well displayed">${j.adminMessage||''}</textarea><textarea id="r-${j.id}" rows=2 placeholder="Revision red lock" style="border-color:#ef4444">${j.revisionNote||''}</textarea><div style="display:flex;gap:6px;margin-top:6px"><button class="btn gold" onclick="save('${j.id}')">💾 Save to Cloud</button><a href="track.html?job=${j.id}" target="_blank" style="padding:10px;border:1px solid #334155;border-radius:8px;color:#fff;text-decoration:none">Track</a></div></div>`}); document.getElementById('list').innerHTML=h||'<div class=card>No jobs in cloud yet. Submit from job.html</div>'}
window.save=async(id)=>{let j=JOBS.find(x=>x.id===id); j.price=document.getElementById('p-'+id).value; j.status=document.getElementById('s-'+id).value; j.adminMessage=document.getElementById('m-'+id).value; j.revisionNote=document.getElementById('r-'+id).value; if(j.revisionNote) j.status='Revision Needed'; if(j._id){try{await updateDoc(doc(db,'jobs',j._id),{price:j.price,status:j.status,adminMessage:j.adminMessage,revisionNote:j.revisionNote}); alert('✅ Saved to CLOUD - visible any phone on track.html')}catch(e){alert('Cloud error: '+e.message)}}}
</script></body></html>
