<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{background:#0f172a;color:#fff;font-family:system-ui;padding:12px;max-width:1000px;margin:auto}.card{background:#1e293b;padding:12px;border-radius:12px;border:1px solid #334155;margin:8px 0}input,textarea,select{width:100%;padding:10px;margin:4px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155;box-sizing:border-box}button{padding:8px 12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:2px}.btn-y{background:#facc15}.btn-b{background:#3b82f6;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<h3 style="color:#facc15">Admin - Seamless</h3><div class="card"><input type="password" id="pass" placeholder="veccta2024"><button class="btn-y" onclick="login()">Login</button></div><div id="area" style="display:none"><button class="btn-y" onclick="load()">Refresh</button><span id="counts"></span><div class="grid"><div><h4>Jobs</h4><div id="jobs"></div></div><div><h4>Tickets + Consultations</h4><div id="tickets"></div></div></div></div>
<script>
const PASS='veccta2024';
function getJobs(){return JSON.parse(localStorage.getItem('veccta_jobs')||localStorage.getItem('karanu_jobs')||'[]')}
function getTickets(){return JSON.parse(localStorage.getItem('veccta_tickets')||localStorage.getItem('karanu_tickets')||'[]')}
function saveJobs(j){localStorage.setItem('veccta_jobs',JSON.stringify(j)); localStorage.setItem('karanu_jobs',JSON.stringify(j));}
function saveTickets(t){localStorage.setItem('veccta_tickets',JSON.stringify(t)); localStorage.setItem('karanu_tickets',JSON.stringify(t));}
function login(){if(pass.value!==PASS){alert('wrong');return;} area.style.display='block'; load();}
function load(){
 let jobs=getJobs(), tickets=getTickets(); counts.textContent=`Jobs ${jobs.length} | Tickets ${tickets.length}`;
 jobsDiv=document.getElementById('jobs'); jobsDiv.innerHTML=jobs.map((j,i)=>`<div class=card style="border-left:4px solid #facc15"><b>${j.id}</b><br>${j.clientName} ${j.clientPhone}<br>${j.service}<br><label>Price</label><input id="p_${i}" value="${j.price||''}"><label>Status</label><select id="s_${i}"><option ${j.status=='Logged'?'selected':''}>Logged</option><option ${j.status=='Quoted'?'selected':''}>Quoted</option><option ${j.status=='In Progress'?'selected':''}>In Progress</option><option ${j.status=='Completed'?'selected':''}>Completed</option></select><label>Admin Msg</label><textarea id="m_${i}">${j.adminMessage||''}</textarea><button class=btn-y onclick="saveJ(${i})">Save Job</button></div>`).join('')||'No jobs on this device';
 document.getElementById('tickets').innerHTML=tickets.map((t,i)=>`<div class=card style="border-left:4px solid ${t.jobId=='CONSULTATION'?'#22c55e':'#3b82f6'}"><b>${t.id}</b> for ${t.jobId} [${t.type}]<br>Q: ${t.message}<br><label>Reply</label><textarea id="r_${i}">${t.adminReply||''}</textarea><select id="ts_${i}"><option ${t.status=='Open'?'selected':''}>Open</option><option ${t.status=='Answered'?'selected':''}>Answered</option><option ${t.status=='Closed'?'selected':''}>Closed</option></select><button class=btn-b onclick="saveT(${i})">Save Ticket</button></div>`).join('')||'No tickets';
}
function saveJ(i){let jobs=getJobs(); jobs[i].price=document.getElementById('p_'+i).value; jobs[i].status=document.getElementById('s_'+i).value; jobs[i].adminMessage=document.getElementById('m_'+i).value; saveJobs(jobs); alert('Job '+jobs[i].id+' saved - client sees PRICE on TRACK');}
function saveT(i){let tickets=getTickets(); tickets[i].adminReply=document.getElementById('r_'+i).value; tickets[i].status=document.getElementById('ts_'+i).value; saveTickets(tickets); alert('Ticket reply saved');}
</script></body></html>
