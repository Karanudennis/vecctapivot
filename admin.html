<!-- Replace admin.html with this BEAUTIFUL version -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><title>VEC Admin Pro</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#f8fafc}
.header{background:#0f172a;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:20px}
.stat{background:#fff;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);text-align:center}
.stat b{font-size:22px;display:block}
.searchBar{padding:0 20px;display:flex;gap:10px}
.searchBar input{flex:1;padding:12px;border:1px solid #e2e8f0;border-radius:10px}
.card{background:#fff;margin:12px 20px;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid #0f172a}
</style></head><body>
<div class="header"><h2>⚡ VECCTAPIVOT - Checker Panel</h2><span id="status">Tracker Linked ✓</span></div>
<div class="stats">
<div class="stat"><b id="cAll">0</b>All</div>
<div class="stat"><b id="cJob">0</b>Jobs</div>
<div class="stat"><b id="cT">0</b>Tickets</div>
<div class="stat"><b id="cQ">0</b>Queue</div>
<div class="stat"><b id="cCl">0</b>Closed</div>
</div>
<div class="searchBar"><input id="search" placeholder="Search TIC-04013 or VEC-JOB or phone" oninput="show()"><button onclick="load()" style="padding:12px 18px;background:#0f172a;color:#fff;border:none;border-radius:10px">Reload</button></div>
<div id="list" style="margin-top:10px"></div>
<div id="debug" style="padding:20px;font-size:12px;color:#64748b"></div>
<script>
const firebaseConfig={apiKey:"YOURS",authDomain:"YOURS",projectId:"YOURS",storageBucket:"YOURS",messagingSenderId:"YOURS",appId:"YOURS"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let all=[];
async function load(){
  try{
    const j=await db.collection("jobs").get();
    const t=await db.collection("tickets").get();
    all=[]; j.forEach(d=>all.push({docId:d.id,col:"jobs",...d.data()})); t.forEach(d=>all.push({docId:d.id,col:"tickets",...d.data()}));
    document.getElementById('cAll').textContent=all.length;
    document.getElementById('cJob').textContent=j.size;
    document.getElementById('cT').textContent=t.size;
    document.getElementById('debug').innerHTML=`Firebase Project: ${firebaseConfig.projectId} | Jobs: ${j.size} | Tickets: ${t.size} | If 0, check Rules and that submit page uses SAME projectId`;
    show();
  }catch(e){document.getElementById('debug').innerHTML="ERROR: "+e.message+" - Set Firestore Rules to allow read,write:true";}
}
function show(){
  const q=document.getElementById('search').value.toUpperCase();
  const f=all.filter(x=>!q||JSON.stringify(x).toUpperCase().includes(q));
  document.getElementById('list').innerHTML=f.map(x=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between"><b>${x.trackingId||x.ticket||x.id||x.docId}</b><span style="background:#fef3c7;padding:2px 8px;border-radius:20px;font-size:11px">${x.status||'queue'} • ${x.col}</span></div>
      <div style="font-size:13px;margin-top:6px">${x.service||x.issue||''} | ${x.phone||''} | ${x.clientName||''}</div>
      <div style="margin-top:6px;font-size:12px">💬 ${x.adminMessage||'No admin reply yet'}</div>
    </div>`).join('')||'<p style="padding:20px">No jobs/tickets found - Firebase returned 0</p>';
}
load();
</script></body></html>
