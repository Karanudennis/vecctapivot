<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VECCTA ADMIN - Fixed Save</title>
<style>
body{background:#0b1220;color:#eef2fa;font-family:Inter,sans-serif;padding:18px}
h1{color:#e6c36a}
.card{background:#121c30;border:1px solid rgba(230,195,106,.3);border-left:5px solid #f59e0b;border-radius:16px;padding:16px;margin:14px 0}
input,select,textarea{width:100%;background:#0b1220;color:#fff;border:1px solid #2a395c;border-radius:10px;padding:10px;margin:6px 0}
.btn{background:#e6c36a;color:#000;border:none;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer;margin:4px}
label{color:#96a0ba;font-size:11px;text-transform:uppercase}
</style>
</head><body>
<h1>VECCTA ADMIN - All Tickets</h1>
<button class="btn" onclick="load()">Refresh</button> <span id="count"></span>
<div id="list"></div>
<script>
function load(){
 let key='veccta_tickets';
 let all=JSON.parse(localStorage.getItem(key)||'[]');
 document.getElementById('count').innerText=`Total: ${all.length}`;
 let h='';
 all.forEach((t,i)=>{
  h+=`<div class="card">
  <b style="color:#e6c36a;font-size:18px">${t.id||t.ticket||'VECCTA-'+i}</b><br>
  <b>${t.clientName||t.name||''}</b> | ${t.phone||''}<br>
  <b>Service:</b> ${t.service||''}<br>
  <b>Logged:</b> ${t.date||t.logged||''}<br>
  <label>Price (KSh)</label><input value="${t.price||''}" id="price-${i}" placeholder="25000">
  <label>Admin Message to Client</label><textarea id="msg-${i}">${t.adminMessage||''}</textarea>
  <label>Status</label><select id="status-${i}">
    <option ${t.status=='Logged'?'selected':''}>Logged</option>
    <option ${t.status=='In Progress'?'selected':''}>In Progress</option>
    <option ${t.status=='Quoted'?'selected':''}>Quoted</option>
    <option ${t.status=='Booked'?'selected':''}>Booked</option>
    <option ${t.status=='Paid'?'selected':''}>Paid</option>
    <option ${t.status=='Done'?'selected':''}>Done</option>
  </select>
  <div style="margin-top:8px">
   <button class="btn" onclick="saveEdit(${i})">Save Price/Message</button>
   <button class="btn" style="background:#ff6b6b" onclick="delTicket(${i})">Delete</button>
  </div>
  </div>`;
 });
 document.getElementById('list').innerHTML=h;
}
function saveEdit(idx){
 let key='veccta_tickets';
 let all=JSON.parse(localStorage.getItem(key)||'[]');
 all[idx].price=document.getElementById(`price-${idx}`).value;
 all[idx].adminMessage=document.getElementById(`msg-${idx}`).value;
 all[idx].status=document.getElementById(`status-${idx}`).value;
 localStorage.setItem(key,JSON.stringify(all));
 alert('SAVED! Price: KSh '+all[idx].price+' | Status: '+all[idx].status);
 load();
}
function delTicket(idx){
 if(!confirm('Delete?')) return;
 let key='veccta_tickets';
 let all=JSON.parse(localStorage.getItem(key)||'[]');
 all.splice(idx,1);
 localStorage.setItem(key,JSON.stringify(all));
 load();
}
load();
</script>
</body></html>
