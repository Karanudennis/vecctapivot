<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - 7 Pillars</title><style>
body{background:#0f172a;color:#fff;font-family:system-ui;padding:12px;max-width:1200px;margin:auto}
.card{background:#1e293b;padding:12px;border-radius:12px;border:1px solid #334155;margin:8px 0}
input,textarea,select{width:100%;padding:10px;margin:4px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155;box-sizing:border-box}
button{padding:8px 12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:2px}
.btn-y{background:#facc15;color:#000}.btn-b{background:#3b82f6;color:#fff}.btn-g{background:#22c55e;color:#000}.btn-r{background:#ef4444;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:800}
.pass-wrap{display:flex;gap:6px;align-items:center}.saved{color:#22c55e;font-weight:800;font-size:12px;display:none;background:#052e16;padding:2px 8px;border-radius:10px;border:1px solid #22c55e}.saved.show{display:inline-block}
.price-input{border:2px solid #facc15!important;color:#facc15!important;font-weight:900;font-size:16px}
.admin-msg{border:2px solid #22c55e!important}.rev-note{border:2px solid #ef4444!important}
.req-box{background:#0f172a;padding:8px;border-radius:8px;font-size:12px;margin:4px 0}
.searchbar{display:flex;gap:6px;margin:8px 0}
</style></head><body>

<h3 style="color:#facc15;margin:0">ADMIN - 7 PILLARS (GitHub Fix)</h3><small style="color:#94a3b8">Shows jobs from same device only - GitHub limit - Use Export/Import to move between phones</small>

<div class="card">
<div class="pass-wrap">
<input type="password" id="pass" placeholder="Password veccta2024">
<button class="btn-y" onclick="togglePass()" id="eyeBtn">👁️ View</button>
<button class="btn-g" onclick="login()">Login</button>
</div>
<div id="loginMsg" style="font-size:12px;margin-top:4px"></div>
</div>

<div id="area" style="display:none">
<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
<button class="btn-g" onclick="load()">🔄 Refresh - Load Jobs</button>
<button class="btn-b" onclick="exportData()">Export JSON</button>
<input type="file" id="importFile" onchange="importData()" style="width:180px">
<button class="btn-r" onclick="clearAll()">Clear Test Data</button>
<span id="counts" style="color:#facc15;font-weight:800;font-size:12px"></span>
</div>
<div class="searchbar"><input id="search" placeholder="Search JOB ID, Name, Phone, Pillar, Service..." oninput="load()"></div>
<div class="grid"><div><h4 style="color:#facc15">JOBS (7 pillars)</h4><div id="jobs"></div></div><div><h4 style="color:#3b82f6">TICKETS</h4><div id="tickets"></div></div></div>
</div>

<script>
const PASS='veccta2024';
function getAllJobs(){
 let a=[], b=[];
 try{a=JSON.parse(localStorage.getItem('veccta_jobs')||'[]')}catch(e){}
 try{b=JSON.parse(localStorage.getItem('karanu_jobs')||'[]')}catch(e){}
 // merge unique by id
 let map={}; [...a,...b].forEach(j=>{ if(j&&j.id) map[j.id]=j; });
 return Object.values(map);
}
function getAllTickets(){
 let a=[], b=[];
 try{a=JSON.parse(localStorage.getItem('veccta_tickets')||'[]')}catch(e){}
 try{b=JSON.parse(localStorage.getItem('karanu_tickets')||'[]')}catch(e){}
 let map={}; [...a,...b].forEach(t=>{ if(t&&t.id) map[t.id]=t; });
 return Object.values(map);
}
function saveJobs(j){ localStorage.setItem('veccta_jobs',JSON.stringify(j)); localStorage.setItem('karanu_jobs',JSON.stringify(j)); }
function saveTickets(t){ localStorage.setItem('veccta_tickets',JSON.stringify(t)); localStorage.setItem('karanu_tickets',JSON.stringify(t)); }

function togglePass(){ let p=pass; if(p.type=='password'){p.type='text'; eyeBtn.textContent='🙈 Hide';} else {p.type='password'; eyeBtn.textContent='👁️ View';} }
function login(){ if(pass.value!==PASS){loginMsg.textContent='❌ Wrong password - veccta2024'; loginMsg.style.color='#ef4444'; return;} loginMsg.textContent='✅ Logged in'; loginMsg.style.color='#22c55e'; area.style.display='block'; load(); }

function load(){
 let allJobs=getAllJobs().slice().reverse();
 let allTickets=getAllTickets().slice().reverse();
 let q=(search.value||'').toLowerCase();
 let jobs=allJobs.filter(j=>!q|| (j.id+' '+j.clientName+' '+j.clientPhone+' '+j.pillar+' '+j.service+' '+j.subService+' '+j.fullService).toLowerCase().includes(q));
 let tickets=allTickets.filter(t=>!q|| (t.id+' '+t.jobId+' '+t.message).toLowerCase().includes(q));

 counts.textContent=`Found: ${allJobs.length} Jobs, ${allTickets.length} Tickets | Showing: ${jobs.length}/${tickets.length} | Device: ${navigator.userAgent.slice(0,30)} | If 0, submit job on SAME phone or Import`;

 if(allJobs.length==0){ document.getElementById('jobs').innerHTML=`<div class=card style="border-left:5px solid #ef4444"><b style="color:#ef4444">No Jobs on this device</b><br><small>Reason: GitHub Pages saves only on browser where job was created. Solution: Submit a test job on this same phone, or use Export on client phone then Import here.<br><br>Keys checked: veccta_jobs, karanu_jobs<br>LocalStorage raw: ${localStorage.getItem('veccta_jobs')?'Has data':'Empty'}</small></div>`; } else {
  document.getElementById('jobs').innerHTML=jobs.map((j,idx)=>{
   let realId=j.id; let realIdx=getAllJobs().findIndex(x=>x.id===realId);
   let req=j.requirements? Object.entries(j.requirements).map(([k,v])=>`<div><b>${k}:</b> ${v||'-'}</div>`).join(''):'-';
   return `<div class=card style="border-left:5px solid ${j.status=='Needs Revision'?'#ef4444':'#facc15'}">
    <div style="display:flex;justify-content:space-between"><b style="color:#facc15">${j.id}</b><span class=badge style="background:${j.status=='Completed'?'#22c55e':j.status=='Needs Revision'?'#ef4444':'#facc15'};color:${j.status=='Logged'||j.status=='Resubmitted'?'#000':'#fff'}">${j.status}</span></div>
    <span id="jsaved_${realIdx}" class="saved">✅ SAVED</span>
    <div style="font-size:11px;color:#94a3b8">${j.logged} | ${j.clientName} ${j.clientPhone}</div>
    <div style="font-size:12px;margin:4px 0"><b>${j.fullService|| (j.pillar+' > '+j.service+' > '+j.subService)}</b><br><small style="color:#94a3b8">Type: ${j.requirementType} | File: ${j.fileName||'No file'} ${j.fileData?'✓':''}</small></div>
    <div class=req-box>${req}<br><b>Details:</b> ${j.details||'-'}<br>${j.revisionReply? `<div style="background:#052e16;padding:4px;border-radius:4px;margin-top:4px;border:1px solid #22c55e"><b style="color:#22c55e">Resubmit:</b> ${j.revisionReply}</div>`:''}</div>
    <label style="color:#facc15;font-size:11px">PRICE KSH</label><input id="price_${realIdx}" class="price-input" value="${j.price||''}" placeholder="3500">
    <label>STATUS</label><select id="status_${realIdx}"><option ${j.status=='Logged'?'selected':''}>Logged</option><option ${j.status=='Quoted'?'selected':''}>Quoted</option><option ${j.status=='In Progress'?'selected':''}>In Progress</option><option ${j.status=='Needs Revision'?'selected':''}>Needs Revision</option><option ${j.status=='Resubmitted'?'selected':''}>Resubmitted</option><option ${j.status=='Completed'?'selected':''}>Completed</option><option ${j.status=='Cancelled'?'selected':''}>Cancelled</option></select>
    <label style="color:#ef4444;font-size:11px">REVISION NOTE (RED LOCK BOX on TRACK)</label><textarea id="rev_${realIdx}" class="rev-note" rows="2">${j.revisionNote||''}</textarea>
    <label style="color:#22c55e;font-size:11px">ADMIN MESSAGE (GREEN BOX on TRACK)</label><textarea id="msg_${realIdx}" class="admin-msg" rows="2">${j.adminMessage||''}</textarea>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">
     <button class=btn-y onclick="saveJob(${realIdx})">💾 Save Job</button>
     <button class=btn-b onclick="document.getElementById('price_${realIdx}').focus()">✏️ Edit</button>
     <button class=btn-g onclick="wa('${j.clientPhone}','${j.id} - Price KSH '+document.getElementById('price_${realIdx}').value)">WhatsApp</button>
     <button class=btn-r onclick="delJob(${realIdx})">Delete</button>
    </div>
   </div>`;
  }).join('');
 }

 if(allTickets.length==0){ document.getElementById('tickets').innerHTML=`<div class=card style="border-left:5px solid #3b82f6"><b>No Tickets on this device</b><br><small>Same reason - localStorage device only</small></div>`; } else {
  document.getElementById('tickets').innerHTML=tickets.map((t)=>{
   let realIdx=getAllTickets().findIndex(x=>x.id===t.id);
   return `<div class=card style="border-left:5px solid #3b82f6">
    <div style="display:flex;justify-content:space-between"><b style="color:#3b82f6">${t.id}</b><span class=badge style="background:${t.status=='Answered'?'#22c55e':'#3b82f6'};color:#fff">${t.status}</span></div>
    <span id="tsaved_${realIdx}" class="saved">✅ SAVED</span>
    <div style="font-size:11px;color:#94a3b8">For ${t.jobId} | ${t.tTypeLabel||t.tType} | ${t.category} | ${t.priority} | ${t.logged}</div>
    <div class=req-box>Q: ${t.message}<br>File: ${t.fileName||'None'}</div>
    <label style="color:#22c55e;font-size:11px">ADMIN REPLY (Well displayed on TRACK)</label><textarea id="reply_${realIdx}" class="admin-msg" rows="3">${t.adminReply||''}</textarea>
    <select id="tstatus_${realIdx}"><option ${t.status=='Open'?'selected':''}>Open</option><option ${t.status=='Answered'?'selected':''}>Answered</option><option ${t.status=='Closed'?'selected':''}>Closed</option></select>
    <div style="display:flex;gap:4px;margin-top:6px"><button class=btn-b onclick="saveTicket(${realIdx})">💾 Save Reply</button><button class=btn-r onclick="delTicket(${realIdx})">Delete</button></div>
   </div>`;
  }).join('');
 }
}

function saveJob(i){
 let jobs=getAllJobs(); let job=jobs[i]; if(!job) return;
 let all=getAllJobs(); let idx=all.findIndex(x=>x.id===job.id); if(idx<0) return;
 all[idx].price=document.getElementById('price_'+i).value;
 all[idx].status=document.getElementById('status_'+i).value;
 all[idx].revisionNote=document.getElementById('rev_'+i).value;
 all[idx].adminMessage=document.getElementById('msg_'+i).value;
 all[idx].locked=(all[idx].status==='Needs Revision');
 saveJobs(all);
 let el=document.getElementById('jsaved_'+i); if(el){ el.textContent='✅ SAVED - Shows on TRACK'; el.classList.add('show'); }
}
function saveTicket(i){
 let all=getAllTickets(); let t=all[i]; if(!t) return;
 all[i].adminReply=document.getElementById('reply_'+i).value;
 all[i].status=document.getElementById('tstatus_'+i).value;
 saveTickets(all);
 let el=document.getElementById('tsaved_'+i); if(el){ el.textContent='✅ SAVED'; el.classList.add('show'); }
}
function delJob(i){ if(confirm('Delete?')){ let all=getAllJobs(); all.splice(i,1); saveJobs(all); load(); } }
function delTicket(i){ if(confirm('Delete?')){ let all=getAllTickets(); all.splice(i,1); saveTickets(all); load(); } }
function wa(phone,msg){ window.open('https://wa.me/'+phone.replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(msg)); }
function exportData(){ let data={jobs:getAllJobs(),tickets:getAllTickets()}; let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='veccta_7pillars_backup.json'; a.click(); }
function importData(){ let f=importFile.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{ try{let d=JSON.parse(e.target.result); if(d.jobs) saveJobs([...getAllJobs(),...d.jobs]); if(d.tickets) saveTickets([...getAllTickets(),...d.tickets]); load(); alert('Imported '+ (d.jobs?.length||0)+' jobs'); }catch(err){alert('Invalid JSON')} }; r.readAsText(f); }
function clearAll(){ if(confirm('Clear all test data on this device?')){ localStorage.removeItem('veccta_jobs'); localStorage.removeItem('karanu_jobs'); localStorage.removeItem('veccta_tickets'); localStorage.removeItem('karanu_tickets'); load(); } }
</script></body></html>
