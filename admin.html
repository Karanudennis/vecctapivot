<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Official Admin Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:14px}
.card{background:#fff;color:#000;border-radius:18px;padding:22px;width:100%;max-width:420px}
input{width:100%;padding:12px 44px 12px 12px;border:1.5px solid #e2e8f0;border-radius:12px;color:#000;margin-top:8px}
.wrap{position:relative;margin-top:8px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:#000;color:#ffcc00;border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:800;font-size:11px}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:10px}
.btn-y{background:#ffcc00;color:#000}.btn-b{background:#000;color:#ffcc00}.btn-o{background:#fff;border:1.5px solid #e2e8f0}
.small{font-size:11px;color:#64748b;margin-top:6px}
.otp{display:none;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:12px}
</style></head><body>
<div class="card">
<h3>🔒 Official Admin Login</h3>
<p class="small">Only <b>vecctapivotenterprises@gmail.com</b> - Old veccta2024 removed</p>
<input id="email" value="vecctapivotenterprises@gmail.com" readonly style="background:#f1f5f9;font-weight:700">
<div class="wrap"><input id="pass" type="password" placeholder="Official password"><button class="eye" onclick="toggle('pass')">👁️ VIEW</button></div>
<button class="btn btn-b" onclick="login()">Login as Official</button>
<button class="btn btn-o" onclick="document.getElementById('resetBox').style.display='block'">🔄 Reset + OTP Option</button>
<div id="resetBox" class="otp">
<b>Reset Password with OTP</b>
<p class="small">Send link to official email - Copy oobCode from link as OTP</p>
<button class="btn btn-y" onclick="sendReset()">Send OTP to Official Email</button>
<input id="otp" placeholder="Enter OTP - oobCode from email link" style="margin-top:10px">
<div class="wrap"><input id="newPass" type="password" placeholder="New password"><button class="eye" onclick="toggle('newPass')">👁️</button></div>
<button class="btn btn-b" onclick="verifyOtp()">Verify OTP & Set New Password</button>
<div id="resetMsg" class="small"></div>
</div>
<div id="msg" class="small" style="color:#dc2626;margin-top:8px"></div>
</div>
<script type="module">
import {auth} from "./firebase.js";
import {signInWithEmailAndPassword,sendPasswordResetEmail,confirmPasswordReset} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const OFFICIAL="vecctapivotenterprises@gmail.com";
window.toggle=(id)=>{let e=document.getElementById(id);e.type=e.type==="password"?"text":"password";};
window.login=async()=>{try{await signInWithEmailAndPassword(auth,OFFICIAL,document.getElementById("pass").value);location.href="./dashboard.html";}catch(e){document.getElementById("msg").innerText=e.message}};
window.sendReset=async()=>{try{await sendPasswordResetEmail(auth,OFFICIAL);document.getElementById("resetMsg").innerText="✅ Sent to "+OFFICIAL+" - Open email, copy oobCode=XXXX from link, paste as OTP";document.getElementById("resetMsg").style.color="#16a34a";}catch(e){document.getElementById("resetMsg").innerText=e.message}};
window.verifyOtp=async()=>{try{await confirmPasswordReset(auth,document.getElementById("otp").value.trim(),document.getElementById("newPass").value.trim());document.getElementById("resetMsg").innerText="✅ New password set! Login above now";document.getElementById("resetMsg").style.color="#16a34a";}catch(e){document.getElementById("resetMsg").innerText="OTP failed: "+e.message+" - Copy oobCode from URL"}};
</script>
</body></html>
