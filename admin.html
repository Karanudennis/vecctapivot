<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEC Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#f1f5f9}
#login{height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a}
.cardL{background:#fff;width:360px;padding:26px;border-radius:16px}
.cardL input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-top:10px;box-sizing:border-box}
.btn{width:100%;padding:12px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer}
#admin{display:none}
.top{padding:14px 20px;background:#0f172a;color:#fff;display:flex;justify-content:space-between}
.list{padding:14px}
.job{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px;border-left:4px solid #0f172a}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:14px}
#modal.show{display:flex}
#box{background:#fff;width:440px;max-width:100%;padding:20px;border-radius:14px}
#box input,#box select,#box textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin-top:8px;box-sizing:border-box}
</style>
</head>
<body>

<div id="login">
<div class="cardL">
<h3 style="text-align:center">VEC Admin</h3>
<div style="position:relative">
<input id="pass" type="password" placeholder="Password">
<span onclick="let p=document.getElementById('pass'); p.type=p.type==='password'?'text':'password'" style="position:absolute;right:8px;top:16px;font-size:11px;background:#eee;padding:5px 8px;border-radius:6px;cursor:pointer">SHOW</span>
</div>
<button class="btn" onclick="login()">Sign In</button>
<p style="font-size:11px;margin-top:8px"><span style="color:#2563eb;cursor:pointer" onclick="document.getElementById('fg').style.display='block'">Forgot?</span> <span style="float:right">Default: VEC2025</span></p>
<div id="fg" style="display:none;margin-top:10px;background:#f8fafc;padding:10px;border-radius:10px">
<input id="code" placeholder="Code: VEC-RESET-2025">
<input id="np" placeholder="New password">
<button class="btn" onclick="if(document.getElementById('code').value==='VEC-RESET-2025'){localStorage.setItem('VEC_PASS',document.getElementById('np').value);alert('Saved');location.reload()}else{alert('Wrong code')}">Reset</button>
</div>
<p id="err" style="color:red;font-size:11px;text-align:center;margin-top:6px"></p>
</div>
</div>

<div id="admin">
<div class="top"><b>Checker Panel</b><button onclick="location.reload()" style="background:#fff;border:none;padding:6px 10px;border-radius:6px;font-weight:700;cursor:pointer">Logout</button></div>
<div style="padding:14px;display:flex;gap:8px">
<input id="s" placeholder="Search TIC-04013 or phone" oninput="show()" style="flex:1;padding:11px;border-radius:10px;border:1px solid #ccc">
<button onclick="load()" style="padding:11px 14px;border-radius:10px;border:none;background:#0f172a;color:#fff;font-weight:700">Reload</button>
<button onclick="test()" style="padding:11px 14px;border-radius:10px;border:none;background:#10b981;color:#fff;font-weight:700">+ TEST</button>
</div>
<div id="info" style="padding:0 14px;font-size:11px;color:#64748b"></div>
<div id="list" class="list"></div>
</div>

<div id="modal"><div id="box">
<h3 id="mid"></h3>
<select id="mStatus"><option value="queue">Queue</option><option value="in_progress">In Progress</option><option value="correction">Correction</option><option value="submitted">Submitted</option><option value="closed">Closed</option></select>
<textarea id="mMsg" rows="4" placeholder="Message for tracker"></textarea>
<button class="btn" onclick="save()">Save to Tracker</button>
<button class="btn" style="background:#e2e8f0;color:#000" onclick="document.getElementById('modal').classList.remove('show')">Cancel</button>
</div></div>

<script>
let PASS = localStorage.getItem('VEC_PASS') || "VEC2025";
const firebaseConfig = {
  apiKey: "PUT_YOURS",
  authDomain: "PUT_YOURS",
  projectId: "PUT_YOURS",
  storageBucket: "PUT_YOURS",
  messagingSenderId: "PUT_YOURS",
  appId: "PUT_YOURS"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let all=[],curId,curCol;

function login(){
  if(document.getElementById('pass').value===PASS){
    document.getElementById('login').style.display='none';
    document.getElementById('admin').style.display='block';
    load();
  }else document.getElementById('err').innerText='Wrong: '+PASS;
}

async function load(){
  try{
    let j,t;
    try{j=await db.collection("jobs").orderBy("createdAt","desc").get()}catch(e){j=await db.collection("jobs").get()}
    try{t=await db.collection("tickets").orderBy("createdAt","desc").get()}catch(e){t=await db.collection("tickets").get()}
    all=[];
    j.forEach(d=>all.push({docId:d.id,col:"jobs",trackingId:d.data().trackingId||d.id,...d.data()}));
    t.forEach(d=>all.push({docId:d.id,col:"tickets",trackingId:d.data().trackingId||d.data().ticket||d.id,...d.data()}));
    document.getElementById('info').innerHTML=all.length+' Total - Jobs:'+j.size+' Tickets:'+t.size+' Project:'+firebaseConfig.projectId;
    show();
  }catch(e){document.getElementById('info').innerHTML='Error: '+e.message;}
}

function show(){
  const q=document.getElementById('s').value.toUpperCase();
  const f=all.filter(x=>!q||JSON.stringify(x).toUpperCase().includes(q));
  document.getElementById('list').innerHTML=f.map(x=>`
    <div class="job">
      <b>${x.trackingId}</b> <small>[${x.col}] ${x.status||'queue'}</small><br>
      <small>👤${x.clientName||x.name||''} 📞${x.phone||''} - ${x.service||x.issue||''}</small>
      <div style="font-size:11px;background:#f8fafc;padding:6px;border-radius:6px;margin-top:6px">💬 ${x.adminMessage||'No reply'}</div>
      <button onclick="openM('${x.docId}','${x.col}')" style="margin-top:8px;padding:7px 12px;background:#0f172a;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer">Respond</button>
    </div>`).join('')||'No jobs/tickets found';
}

function openM(id,col){
  const x=all.find(a=>a.docId===id&&a.col===col);
  curId=id;curCol=col;
  document.getElementById('mid').innerText=x.trackingId;
  document.getElementById('mStatus').value=x.status||'queue';
  document.getElementById('mMsg').value=x.adminMessage||'';
  document.getElementById('modal').classList.add('show');
}
async function save(){
  const s=document.getElementById('mStatus').value;
  const m=document.getElementById('mMsg').value;
  if(!m) return alert('Write message');
  await db.collection(curCol).doc(curId).update({status:s,adminMessage:m,adminResponseAt:new Date()});
  document.getElementById('modal').classList.remove('show');
  load();
}
async function test(){
  const id="VEC-JOB-"+Math.floor(1000+Math.random()*9000);
  await db.collection("jobs").doc(id).set({trackingId:id,clientName:"Test",phone:"0700000000",service:"Test Job",status:"queue",createdAt:new Date()});
  load();
}
</script>
</body>
</html>
