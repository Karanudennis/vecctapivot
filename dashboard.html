<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard - Official Only</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0f172a;color:#fff}
.top{background:#000;color:#ffcc00;padding:14px;display:flex;justify-content:space-between;align-items:center}
.card{max-width:1000px;margin:16px auto;background:#fff;color:#000;border-radius:16px;padding:16px}
.job{border:1.5px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;background:#f8fafc}
.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:800;cursor:pointer}
.btn-y{background:#ffcc00;color:#000}.btn-b{background:#000;color:#ffcc00}
input{width:100%;padding:11px;border:1.5px solid #e2e8f0;border-radius:10px;color:#000;margin-top:10px}
</style></head><body>
<div class="top"><div>🔒 OFFICIAL ONLY - CHECK JOBS</div><div id="who" style="background:#222;padding:6px 12px;border-radius:20px;font-size:11px;color:#ffcc00">Checking...</div></div>
<div class="card"><h3>Official Dashboard - 7x7x7 Jobs</h3><input id="search" placeholder="Search Ticket, email, phone, service..." oninput="filterJobs()"><div id="list" style="margin-top:12px">Loading...</div><button class="btn btn-b" style="margin-top:12px" onclick="logout()">Log Out - Back to Admin Login</button></div>
<script type="module">
import {auth,db} from "./firebase.js";
import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {collection,getDocs,orderBy,query,doc,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let allJobs=[]; const OFFICIAL="vecctapivotenterprises@gmail.com";
onAuthStateChanged(auth,async u=>{
 if(!u){location.href='./admin-login.html';return;}
 document.getElementById("who").innerText=u.email;
 if(u.email.toLowerCase()!==OFFICIAL){document.getElementById("list").innerHTML=`<div style="background:#fee2e2;padding:16px;border-radius:12px;text-align:center">🔒 Admin Only<br>Only <b>${OFFICIAL}</b><br>You are ${u.email}<br><br><button class="btn btn-b" onclick="location.href='./admin-login.html'">LOGIN AS OFFICIAL</button></div>`;return;}
 const snap=await getDocs(query(collection(db,"jobs"),orderBy("createdAt","desc")));
 allJobs=[];snap.forEach(d=>allJobs.push({id:d.id,...d.data()})); render(allJobs);
});
function render(j){document.getElementById("list").innerHTML=j.length?j.map(x=>`<div class="job"><div><b>${x.jobId}</b> ${x.status}<br>${x.pillar}→${x.sub}→<b>${x.service}</b><br>${x.name}•${x.phone}</div><div><button class="btn btn-b" onclick="closeJob('${x.id}')">Close</button></div></div>`).join(""):"No jobs yet";}
window.filterJobs=()=>{let s=document.getElementById("search").value.toLowerCase();render(allJobs.filter(j=>(j.jobId+j.email+j.phone+j.service).toLowerCase().includes(s)));};
window.closeJob=async(id)=>{if(!confirm("Close?"))return;await updateDoc(doc(db,"jobs",id),{status:"closed"});location.reload();};
window.logout=async()=>{await signOut(auth);location.href='./admin-login.html';};
</script>
</body></html>
