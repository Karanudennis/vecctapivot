<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Ticket - VECCTAPIVOT</title>
<style>
body{background:#0b1220;color:#eef2fa;font-family:Inter,sans-serif;padding:18px}
.box{background:#121c30;border:1px solid rgba(230,195,106,.35);border-radius:16px;padding:22px;max-width:620px;margin:20px auto}
h1{color:#e6c36a;text-align:center}
label{color:#96a0ba;font-size:13px;margin-top:10px;display:block}
input,select,textarea{width:100%;padding:14px;border-radius:10px;border:1px solid #2a395c;background:#0b1220;color:#fff;margin:6px 0 12px;box-sizing:border-box}
.btn{background:#e6c36a;color:#000;border:none;padding:14px;width:100%;border-radius:10px;font-weight:900;cursor:pointer;font-size:16px}
.ticketId{background:#0b1a33;border:2px dashed #e6c36a;padding:16px;border-radius:12px;text-align:center;margin:16px 0;display:none}
</style>
</head><body>
<div class="box">
<h1>Book a Ticket</h1>
<p style="text-align:center;color:#96a0ba">Get place in queue - TKT reference</p>

<label>Your Full Name</label>
<input id="name" placeholder="John Kamau">

<label>Phone / WhatsApp</label>
<input id="phone" placeholder="07XX XXX XXX">

<label>Select Service Pillar</label>
<select id="pillar">
<option>Digital & Brand Systems</option>
<option>Academic & Testing Logistics</option>
<option>Transport Brokerage Hub</option>
<option>Merchandise Sourcing Links</option>
<option>Independent Fixer Desk</option>
<option>General Agency Core</option>
<option>Statutory & Portal Logistics</option>
</select>

<label>Service Needed</label>
<input id="service" placeholder="e.g. BRS BN Registration, Passport, Cargo">

<label>Details</label>
<textarea id="details" rows="3" placeholder="Describe what you need..."></textarea>

<button class="btn" onclick="bookTicket()">Book Ticket Now</button>

<div id="showTicket" class="ticketId"></div>
</div>

<script>
function bookTicket(){
 let name=document.getElementById('name').value.trim();
 let phone=document.getElementById('phone').value.trim();
 let service=document.getElementById('service').value.trim();
 if(!name||!phone||!service){alert('Fill Name, Phone, Service');return;}

 let id='VECCTA-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(1000+Math.random()*9000);
 let ticket={
   id:id,
   ticket:id,
   clientName:name,
   name:name,
   phone:phone,
   pillar:document.getElementById('pillar').value,
   service:service,
   details:document.getElementById('details').value,
   price:'',
   status:'Logged - Awaiting Quote',
   adminMessage:'We have received your ticket. Admin will update price & details shortly. You can WhatsApp us with your ID.',
   date:new Date().toLocaleString(),
   logged:new Date().toLocaleString()
 };
 let keys=['veccta_tickets'];
 let arr=JSON.parse(localStorage.getItem('veccta_tickets')||'[]');
 arr.push(ticket);
 localStorage.setItem('veccta_tickets',JSON.stringify(arr));
 
 document.getElementById('showTicket').style.display='block';
 document.getElementById('showTicket').innerHTML=`<b style="color:#e6c36a;font-size:22px">${id}</b><br>Saved! Track now<br><br><a href="track.html" style="background:#e6c36a;color:#000;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:800">Go to Track</a> &nbsp; <a href="https://wa.me/254788099685?text=New Ticket ${id} - ${name}" style="color:#25D366;font-weight:700">WhatsApp</a>`;
}
</script>
</body></html>
