<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Both - Job & Ticket</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:sans-serif;background:#f5f7fb;margin:0;padding:20px}
.box{background:#fff;padding:20px;border-radius:16px;max-width:600px;margin:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
input{width:100%;padding:14px;border:2px solid #111827;border-radius:10px;font-size:16px;box-sizing:border-box}
.btn{padding:12px 20px;background:#111827;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-top:10px;font-weight:700}
.result{margin-top:16px;padding:14px;border-radius:10px;background:#f9fafb}
</style>
</head>
<body>
<div class="box">
<h2>TRACK BOTH - JOB & TICKET</h2>
<p style="font-size:12px;color:#666">Enter any ID: VEC-JOB, VEC-TKT, TIC- , JOB- , etc</p>
<input id="trackInput" placeholder="VEC-JOB-XXXXX or TIC-XXXXX - Tracks BOTH">
<button class="btn" onclick="trackBoth()">Track Now</button>
<div id="result" class="result">Enter ID above</div>
<div id="debug" style="font-size:11px;color:#666;margin-top:10px"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_SENDER",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function trackBoth(){
  const urlParams = new URLSearchParams(window.location.search);
  let id = urlParams.get('ticket') || urlParams.get('id') || urlParams.get('job') || document.getElementById('trackInput').value;
  id = (id||'').trim().toUpperCase();
  if(!id){ document.getElementById('result').innerHTML="❌ Enter ID"; return; }
  
  document.getElementById('trackInput').value = id;
  document.getElementById('result').innerHTML = "🔍 Searching Firebase for: "+id+"...";
  
  try{
    const jobsSnap = await db.collection("jobs").get();
    const ticketsSnap = await db.collection("tickets").get();
    
    let found = null;
    let allSeen = [];
    
    jobsSnap.forEach(doc=>{
      const d = doc.data();
      allSeen.push(d.trackingId || d.id || doc.id);
      const check = [d.trackingId, d.id, d.ticket, doc.id, d.tracking].join(' ').toUpperCase();
      if(check.includes(id)) found = { ...d, _col:'jobs', _docId:doc.id };
    });
    
    ticketsSnap.forEach(doc=>{
      const d = doc.data();
      allSeen.push(d.trackingId || d.ticket || d.id || doc.id);
      const check = [d.trackingId, d.ticket, d.id, doc.id, d.tracking].join(' ').toUpperCase();
      if(check.includes(id)) found = { ...d, _col:'tickets', _docId:doc.id };
    });

    if(found){
      document.getElementById('result').innerHTML = `
        <div style="color:green;font-weight:700">✅ FOUND: ${id} in ${found._col}</div>
        <div style="margin-top:8px"><b>Status:</b> ${found.status||'queue'}</div>
        <div><b>Service:</b> ${found.service||found.issue||found.pillar||''}</div>
        <div><b>Phone:</b> ${found.phone||''}</div>
        <div style="margin-top:8px;background:#fff;padding:8px;border-radius:6px;border-left:4px solid #111827">
          <b>Admin Message:</b><br>${found.adminMessage||'⏳ Waiting for admin reply - denniskmuthoni@gmail.com will reply soon'}
          ${found.adminResponseAt? '<br><small>At: '+new Date(found.adminResponseAt.seconds*1000).toLocaleString()+'</small>':''}
        </div>
      `;
    }else{
      document.getElementById('result').innerHTML = `❌ Not found BOTH: ${id}`;
      document.getElementById('debug').innerHTML = `Debug: Firebase has ${allSeen.length} records. Last 5 IDs: ${allSeen.slice(-5).join(', ')}<br>
      If empty, your SUBMIT code is not saving to Firebase. Check Firestore Rules = allow read,write:true and firebaseConfig same as submit page.`;
    }
  }catch(e){
    document.getElementById('result').innerHTML = "🔥 Firebase Error: "+e.message+"<br>Fix Rules to: allow read, write: if true;";
  }
}

// Auto-track if ?ticket= in URL
window.onload = ()=>{
  const params = new URLSearchParams(window.location.search);
  const t = params.get('ticket') || params.get('id');
  if(t){ document.getElementById('trackInput').value = t; trackBoth(); }
}
</script>
</body>
</html>
