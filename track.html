<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track BOTH Job & Ticket - Admin Message</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f6f7f9}.hero{background:#000;color:white;padding:24px 16px;text-align:center}
.hero span{color:#ffcc00}.container{max-width:820px;margin:-18px auto 0;padding:0 12px 20px}
.search-card{background:white;border-radius:18px;padding:14px;border:1px solid #eee;box-shadow:0 12px 40px rgba(0,0,0,0.08);display:flex;gap:8px}
.search-card input{flex:1;padding:14px;border:1.5px solid #e5e7eb;border-radius:12px;font-weight:600}
.search-card button{padding:14px 20px;background:#000;color:#ffcc00;border:none;border-radius:12px;font-weight:800}
.card{background:white;border-radius:16px;padding:14px;border:1px solid #eee;box-shadow:0 4px 16px rgba(0,0,0,0.04);margin-top:12px}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;color:white}
.open{background:#3b82f6}.in_progress{background:#f59e0b}.correction{background:#ef4444}.closed{background:#16a34a}
.timeline{margin-left:8px;padding-left:20px;border-left:2px solid #eee}
.t-item{position:relative;padding:10px 0}.t-item::before{content:"";position:absolute;left:-27px;top:14px;width:12px;height:12px;border-radius:50%;background:#e5e7eb;border:2px solid white}
.t-item.done::before{background:#16a34a}.t-item.active::before{background:#ffcc00}
.admin-box{background:#eff6ff;border-left:4px solid #3b82f6;padding:12px;border-radius:10px;margin-top:6px}
.corr-box{background:#fef2f2;border:2px solid #fecaca;border-radius:14px;padding:12px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:800}
</style>
</head>
<body>
<div class="hero"><h1>TRACK <span>BOTH</span> - JOB & TICKET</h1><p style="opacity:0.6;font-size:11px">Message from admin whether is ticket or job - Vecctapivotenterprises@gmail.com + Time + Unlock</p><p id="userInfo" style="color:#ffcc00;font-size:11px;margin-top:8px"></p></div>
<div class="container">
<div class="search-card"><input id="trackId" placeholder="VEC-JOB-XXXXX or VEC-TKT-XXXXX - Tracks BOTH"><button onclick="trackNow()">TRACK</button></div>
<p id="trackResult" style="margin:8px 4px;font-size:12px;font-weight:700"></p>
<div id="details" style="display:none"></div>
</div>
<script type="module">
import {auth,db} from "./firebase.js";import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import {collection,query,where,getDocs,doc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let currentUser=null,currentDocId="",currentCol="",currentData=null;
onAuthStateChanged(auth,u=>{currentUser=u;document.getElementById("userInfo").innerText=u?`✅ ${u.email} • Admin Vecctapivotenterprises@gmail.com will reply to BOTH Job & Ticket`:"Login to track";const id=new URLSearchParams(location.search).get("id");if(id){document.getElementById("trackId").value=id; if(u) trackNow();}});
window.trackNow=async()=>{
  if(!currentUser){location.href='./test-login.html';return;}
  const id=document.getElementById("trackId").value.trim().toUpperCase();if(!id){alert("Enter VEC-JOB or VEC-TKT ID *");return;}
  document.getElementById("trackResult").innerText="⏳ Searching BOTH Jobs & Tickets...";
  try{
    let found=null,col="",docId="";
    let q=query(collection(db,"jobs"),where("jobId","==",id));let snap=await getDocs(q);
    if(!snap.empty){found=snap.docs[0].data();col="jobs";docId=snap.docs[0].id;}
    else{q=query(collection(db,"tickets"),where("ticketId","==",id));snap=await getDocs(q);if(!snap.empty){found=snap.docs[0].data();col="tickets";docId=snap.docs[0].id;}}
    if(!found){document.getElementById("trackResult").innerHTML=`❌ Not found BOTH: ${id}`;return;}
    document.getElementById("trackResult").innerHTML=`✅ Found BOTH system: ${found.jobId?"📦 JOB":"🎫 TICKET"} <b>${id}</b> - ${found.service||found.ticketType}`;
    currentDocId=docId;currentCol=col;currentData=found; render(found);
  }catch(e){document.getElementById("trackResult").innerText=e.message;}
};
function render(d){
  const det=document.getElementById("details");det.style.display="block";
  let status=d.status||"open";let created=d.createdAt?new Date(d.createdAt.seconds*1000).toLocaleString():"Now";
  let response=d.adminResponseAt?new Date(d.adminResponseAt.seconds*1000).toLocaleString():"Not yet - Waiting";
  let formData=d.formData||{}; let isJob=!!d.jobId;
  let html=`
  <div class="card"><div style="display:flex;justify-content:space-between"><b>${d.jobId||d.ticketId}</b><div><span style="background:#000;color:#ffcc00;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:800;margin-right:4px">${isJob?"📦 JOB 7x7x7":"🎫 TICKET"}</span><span class="badge ${status.includes('correction')?'correction':status}">${status.toUpperCase()}</span></div></div>
  <div style="background:#fffbe6;border:1.5px solid #ffcc00;border-radius:8px;padding:8px;margin:8px 0;font-size:11px;font-weight:700;text-align:center">${d.pillar||d.ticketType||""} ${d.sub?`→ ${d.sub}`:""} ${d.service?`→ ${d.service}`:""}</div>
  <small>${d.name} | ${d.phone} | ${d.location}</small><br><small style="color:#666">Created: ${created} | Response Time: ${response}</small></div>

  <div class="card"><b>📍 Steps - Tracking BOTH Job & Ticket</b><div class="timeline" style="margin-top:10px">
  <div class="t-item done"><b>📦 Request Received - ${isJob?"Job":"Ticket"} Submitted</b><br><small style="color:#666">${d.pillar||d.ticketType} ${d.service||""}</small><br><small style="color:#999">${created}</small></div>
  <div class="t-item ${d.adminResponseAt?'done':'active'}"><b>👀 Admin Review - Vecctapivotenterprises@gmail.com</b><br><small style="color:#666">${d.adminResponseAt?'Reviewed - Message below with time':'Pending review'}</small><br><small style="color:#999">${response}</small></div>
  <div class="t-item active"><b>${status.includes('correction')?'⚠️ Correction Required':status=='in_progress'?'⚙️ In Progress':status=='closed'?'✅ Closed':'⏳ Current Status'}</b><br><small style="color:#666">${status} - ${status.includes('correction')?d.correctionFields||'Fix required':''}</small></div>
  </div></div>

  <div class="card" style="border-left:5px solid #3b82f6">
    <b>💬 Message from Admin - Vecctapivotenterprises@gmail.com - ${isJob?"📦 JOB":"🎫 TICKET"} ${d.jobId||d.ticketId} - Shows whether is ticket or job</b>
    <div style="font-size:10px;color:#666;margin:4px 0">Response Time: ${response} | Admin: ${d.adminEmail||'Vecctapivotenterprises@gmail.com'}</div>
    <div class="admin-box">${d.adminMessage?d.adminMessage:'<i style="color:#999">No admin message yet - Admin will send message here with time - Works for BOTH Job & Ticket</i>'}</div>
    ${d.correctionMessage?`<div style="background:#fef2f2;border-left:4px solid #ef4444;padding:10px;border-radius:8px;margin-top:8px"><b>⚠️ Correction Message:</b> ${d.correctionMessage}<br><small>Fields: ${d.correctionFields||''}</small></div>`:''}
  </div>

  ${status.includes('correction')?`<div class="card corr-box"><b>⚠️ Correction - You Unlocked - Resubmit</b><textarea id="corrDet" placeholder="Corrected details *" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin:8px 0"></textarea><input id="corrPh" placeholder="07XXXXXXXX *" value="${d.phone||''}" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd"><button onclick="resubmit()" class="btn" style="background:#ef4444;color:white;margin-top:8px">🔄 RESUBMIT ${isJob?'JOB':'TICKET'}</button></div>`:''}

  <div class="card"><b>📝 Details you filled / uploaded</b><br><div style="margin-top:8px">${Object.entries(formData).map(([k,v])=>`<small>${k.toLowerCase().includes('photo')?'📁 FILE':'📝 DATA'} ${k}: ${v}</small><br>`).join('')||`<small>${d.details||''}</small>`}</div></div>
  `;
  det.innerHTML=html;
}
window.resubmit=async()=>{
  const det=document.getElementById("corrDet").value.trim();const ph=document.getElementById("corrPh").value.trim();
  if(!det){alert("Enter corrected details *");return;}
  try{await updateDoc(doc(db,currentCol,currentDocId),{details:det,phone:ph,status:"open",correctionMessage:"",adminMessage:`User resubmitted ${currentData.jobId?'JOB':'TICKET'} at ${new Date().toLocaleString()} - ${det}`,userResubmittedAt:serverTimestamp()});alert("✅ Resubmitted BOTH system - Status open - Admin Vecctapivotenterprises@gmail.com will respond with new time");trackNow();}catch(e){alert(e.message);}
};
</script>
</body>
</html>
