<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track - VeccTa</title>
<style>
body{font-family:system-ui;background:#0f172a;color:white;padding:16px;max-width:600px;margin:auto}
.card{background:#1e293b;padding:16px;border-radius:12px;margin:10px 0;border:1px solid #334155}
input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;background:#0f172a;color:white;border:1px solid #334155}
button{padding:12px 16px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:4px}
.btn-yellow{background:#facc15;color:#0f172a} .btn-blue{background:#3b82f6;color:white}
.tabs{display:flex;gap:8px;margin:10px 0} .tab{flex:1;padding:12px;background:#1e293b;border-radius:8px;text-align:center;cursor:pointer}
.tab.active{background:#facc15;color:#0f172a}
</style>
</head>
<body>
<h3>Track Center</h3>
<div class="tabs">
  <div class="tab active" onclick="showTab('job')">TRACK JOB</div>
  <div class="tab" onclick="showTab('ticket')">TRACK TICKET</div>
</div>

<!-- JOB TRACK -->
<div id="jobTab">
  <div class="card">
    <input id="jobIdInput" placeholder="Enter JOB-...">
    <button class="btn-yellow" onclick="trackJob()">Track Job</button>
  </div>
  <div id="jobResult"></div>
  <div id="raiseTicketBox" style="display:none" class="card">
    <h4>Raise Ticket for this Job</h4>
    <textarea id="ticketMsg" placeholder="Your question about this job..."></textarea>
    <button class="btn-blue" onclick="createTicketForJob()">RAISE TICKET</button>
    <div id="jobTickets"></div>
  </div>
</div>

<!-- TICKET TRACK -->
<div id="ticketTab" style="display:none">
  <div class="card">
    <input id="ticketIdInput" placeholder="Enter TICKET-...">
    <button class="btn-blue" onclick="trackTicket()">Track Ticket</button>
  </div>
  <div id="ticketResult"></div>
</div>

<script>
let currentJobId = null;

function showTab(t){ 
  document.getElementById('jobTab').style.display=t=='job'?'block':'none';
  document.getElementById('ticketTab').style.display=t=='ticket'?'block':'none';
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(t=='job'&&i==0)||(t=='ticket'&&i==1)));
}

// TRACK JOB - ONLY FROM karanu_jobs
function trackJob(){
  const id = document.getElementById('jobIdInput').value.trim();
  let jobs = JSON.parse(localStorage.getItem('karanu_jobs')||'[]');
  let job = jobs.find(j=>j.id===id);
  if(!job){ document.getElementById('jobResult').innerHTML='<div class=card>Job not found</div>'; return; }
  currentJobId = job.id;
  document.getElementById('jobResult').innerHTML = `
    <div class=card>
      <b>${job.id}</b><br>${job.clientName} | ${job.clientPhone}<br>
      Service: ${job.service}<br>Logged: ${job.logged}<br>
      <b>PRICE: KSH ${job.price}</b><br>
      ADMIN MESSAGE: ${job.adminMessage}<br>
      STATUS: <b>${job.status}</b>
    </div>`;
  document.getElementById('raiseTicketBox').style.display='block';
  loadTicketsForJob(job.id);
}

// CREATE TICKET - LINKED TO JOB, NO PRICE
function createTicketForJob(){
  if(!currentJobId){ alert('Track a job first'); return; }
  const msg = document.getElementById('ticketMsg').value;
  if(!msg){ alert('Enter message'); return; }
  let tickets = JSON.parse(localStorage.getItem('karanu_tickets')||'[]');
  const ticket = {
    id: `TICKET-${Date.now()}`,
    jobId: currentJobId, // LINK - different from job
    message: msg,
    from: 'Client',
    adminReply: '',
    status: 'Open',
    logged: new Date().toLocaleString()
  };
  tickets.push(ticket);
  localStorage.setItem('karanu_tickets', JSON.stringify(tickets));
  document.getElementById('ticketMsg').value='';
  alert(`Ticket Created: ${ticket.id} for ${currentJobId}`);
  loadTicketsForJob(currentJobId);
}

function loadTicketsForJob(jobId){
  let tickets = JSON.parse(localStorage.getItem('karanu_tickets')||'[]');
  let related = tickets.filter(t=>t.jobId===jobId);
  document.getElementById('jobTickets').innerHTML = '<h4>Tickets for this Job:</h4>' + related.map(t=>`
    <div class=card style="border-left:4px solid #3b82f6">
      <b>${t.id}</b> - ${t.status}<br>${t.message}<br>
      ${t.adminReply?'<b>Admin:</b> '+t.adminReply:''}
    </div>`).join('') || '<p>No tickets yet</p>';
}

// TRACK TICKET - ONLY FROM karanu_tickets
function trackTicket(){
  const id = document.getElementById('ticketIdInput').value.trim();
  let tickets = JSON.parse(localStorage.getItem('karanu_tickets')||'[]');
  let t = tickets.find(x=>x.id===id);
  if(!t){ document.getElementById('ticketResult').innerHTML='<div class=card>Ticket not found</div>'; return; }
  document.getElementById('ticketResult').innerHTML = `
    <div class=card>
      <b>${t.id}</b><br>For JOB: ${t.jobId}<br>
      Your Message: ${t.message}<br>
      Status: ${t.status}<br>
      ${t.adminReply?'<b>Admin Reply:</b> '+t.adminReply:''}<br>
      Logged: ${t.logged}
    </div>`;
}

// Auto track from URL ?job=JOB-xxx
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('job')){ document.getElementById('jobIdInput').value=urlParams.get('job'); trackJob(); }
</script>
</body>
</html>
