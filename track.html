<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Service - VECCTA</title>
<style>body{background:#0b1220;color:#eef2fa;font-family:Inter,sans-serif;padding:18px}.box{background:#121c30;border:1px solid rgba(230,195,106,.35);border-radius:16px;padding:22px;max-width:620px;margin:20px auto}h1{color:#e6c36a;text-align:center}input{width:100%;padding:14px;border-radius:10px;border:1px solid #2a395c;background:#0b1220;color:#fff;margin:10px 0}.btn{background:#e6c36a;color:#000;border:none;padding:14px;width:100%;border-radius:10px;font-weight:800;cursor:pointer}.result{margin-top:20px;padding:16px;border-left:5px solid #e6c36a;background:#0b1a33;border-radius:12px;display:none}.price{font-size:28px;color:#e6c36a;font-weight:900}.status{padding:6px 14px;border-radius:20px;font-weight:800;display:inline-block}.msgBox{margin-top:12px;padding:14px;background:#0b1220;border-radius:10px;border:1px solid #2a395c}</style>
</head><body>
<div class="box">
<h1>Track Your Ticket</h1>
<input id="searchId" placeholder="VECCTA-0">
<button class="btn" onclick="track()">Track Now</button>
<div id="result" class="result"></div>
</div>
<script>
function track(){
 let all=JSON.parse(localStorage.getItem('veccta_tickets')||'[]');
 let id=document.getElementById('searchId').value.trim();
 let t=null,idx=-1;
 if(id.toUpperCase().startsWith('VECCTA-')){
   let num=parseInt(id.split('-')[1]);
   if(all[num]){t=all[num];idx=num;}
 }
 if(!t){idx=all.findIndex(x=>x.id==id||x.ticket==id); if(idx>=0)t=all[idx];}
 let div=document.getElementById('result');
 if(!t){div.style.display='block';div.innerHTML=`Not found. Try ${all.map((_,i)=>'VECCTA-'+i).join(', ')}`;return;}
 div.style.display='block';
 div.innerHTML=`<b style="color:#e6c36a">${t.id||'VECCTA-'+idx}</b><br>${t.clientName||''}<br><div class="price">${t.price?'KSh '+t.price:'Quote Pending'}</div><div class="status">${t.status||'Logged'}</div><div class="msgBox"><b>Update from Admin:</b><br>${t.adminMessage||'Admin will update soon'}</div><br><a href="https://wa.me/254768309956?text=Ticket ${t.id||'VECCTA-'+idx}" style="color:#25D366">WhatsApp Us</a>`;
}
</script>
</body></html>
