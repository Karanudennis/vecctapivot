<!DOCTYPE html>
<html>
<head>
<title>Track - VECCTA - Admin Messages + Correction</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:8px}
.top{background:black;color:#ffcc00;padding:10px;border-radius:8px;text-align:center;position:sticky;top:0;z-index:5}
.card{background:white;padding:12px;border-radius:8px;margin:8px 0;border-left:4px solid #ffcc00}
.step{display:flex;align-items:center;padding:8px;border-bottom:1px solid #eee}
.step.done{color:#4caf50;font-weight:bold}
.step.active{color:#ff9800;font-weight:bold;background:#fff3e0}
.step.pending{color:#999}
.badge{padding:3px 8px;border-radius:10px;font-size:11px;margin-left:6px}
.badge.open{background:#2196F3;color:white}
.badge.closed{background:#4caf50;color:white}
.badge.correction{background:#ff5722;color:white}
input,textarea{width:100%;padding:9px;margin:4px 0;border:1px solid #ddd;border-radius:5px;box-sizing:border-box}
button{padding:10px 16px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
#loginGate{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999;text-align:center;padding-top:60px;color:white;display:none}
.adminMsg{background:#e3f2fd;border-left:4px solid #2196F3;padding:10px;margin:8px 0;border-radius:6px}
.correctionBox{background:#ffebee;border:2px solid #ff5722;padding:12px;border-radius:8px;margin:10px 0}
</style>
</head>
<body>

<div id="loginGate">
  <h2>🔒 Login to Track</h2>
  <p>Interface free to browse</p>
  <p>Tracking needs login</p>
  <button onclick="location.href='./test-login.html'" style="background:#ffcc00;color:black;width:auto;padding:12px 24px;font-size:16px">LOGIN TO TRACK</button>
</div>

<div class="top">
<b>🔍 TRACK VEC-JOB / VEC-TKT</b><br>
<small>See Admin Messages + Steps + Time Response + Correction</small><br>
<small id="userInfo">Checking login...</small>
</div>

<div class="card">
<b>Enter ID to Track <span style="color:red">*</span></b>
<div style="display:flex;gap:5px">
<input id="trackId" placeholder="VEC-JOB-XXXXX or VEC-TKT-XXXXX *">
<button onclick="trackNow()" style="background:black;color:#ffcc00;width:auto">TRACK</button>
</div>
<small>Login required if you need tracking - As you said</small>
<p id="trackResult"></p>
</div>

<div id="detailsCard" style="display:none"></div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let currentUser=null;

onAuthStateChanged(auth, user=>{
  currentUser=user;
  if(!user){
    document.getElementById("loginGate").style.display="block";
    document.getElementById("userInfo").innerHTML="❌ Not logged - Login to track";
  } else {
    document.getElementById("loginGate").style.display="none";
    document.getElementById("userInfo").innerHTML=`✅ ${user.email} - Enter ID to track`;
    // Auto track if id in URL
    const urlParams=new URLSearchParams(window.location.search);
    const id=urlParams.get("id");
    if(id){ document.getElementById("trackId").value=id; trackNow(); }
  }
});

window.trackNow=async()=>{
  if(!currentUser){ location.href='./test-login.html'; return; }
  const id=document.getElementById("trackId").value.trim().toUpperCase();
  if(!id){ alert("Enter VEC-JOB or VEC-TKT ID *"); return; }
  document.getElementById("trackResult").innerHTML="⏳ Searching...";

  try{
    let found=null; let type=""; let col="";
    // Try jobs
    let q=query(collection(db,"jobs"), where("jobId","==",id));
    let snap=await getDocs(q);
    if(!snap.empty){ found=snap.docs[0].data(); type="JOB"; col="jobs"; }
    else {
      q=query(collection(db,"tickets"), where("ticketId","==",id));
      snap=await getDocs(q);
      if(!snap.empty){ found=snap.docs[0].data(); type="TICKET"; col="tickets"; }
    }

    if(!found){
      document.getElementById("trackResult").innerHTML=`<div style="background:#ffebee;padding:10px;border-radius:6px;color:#c62828">❌ Not Found: ${id}<br>Check ID - Must be VEC-JOB or VEC-TKT you created after login</div>`;
      document.getElementById("detailsCard").style.display="none";
      return;
    }

    // Ownership check - only owner or admin can see
    if(found.userId!==currentUser.uid && currentUser.email!=="karanud96@gmail.com"){
      document.getElementById("trackResult").innerHTML=`⚠️ This ${id} belongs to ${found.userEmail} - You logged as ${currentUser.email} - Login with owner account`;
      return;
    }

    document.getElementById("trackResult").innerHTML=`✅ Found ${type}: ${id}`;
    showDetails(found,type,snap.docs[0].id,col);

  }catch(e){
    document.getElementById("trackResult").innerHTML=`❌ Error: ${e.message}`;
  }
};

function showDetails(data,type,docId,colName){
  const card=document.getElementById("detailsCard"); card.style.display="block";
  let status=data.status||"open";
  let statusClass=status.includes("correction")?"correction":status=="closed"?"closed":"open";
  let adminMsg=data.adminMessage||data.adminReply||"";
  let correctionMsg=data.correctionMessage||"";
  let responseTime=data.adminResponseAt?new Date(data.adminResponseAt.seconds*1000).toLocaleString():"Not responded yet";
  let createdTime=data.createdAt?new Date(data.createdAt.seconds*1000).toLocaleString():"";

  // Steps logic
  let steps=[];
  if(type=="JOB"){
    steps=[
      {name:"Request Received",done:true},
      {name:"Admin Review",done:status!="open"||adminMsg!=""},
      {name: status.includes("correction")?"Correction Required - Unlock for User": "In Progress",done:status=="in_progress"||status.includes("correction")||status=="closed",active:status=="in_progress"||status.includes("correction")},
      {name: status=="closed"?"Closed - Service Delivered":"Pending Delivery",done:status=="closed",active:status=="closed"}
    ];
  } else {
    steps=[
      {name:"Ticket Booked",done:true},
      {name:"Admin Response",done:adminMsg!=""},
      {name: status.includes("correction")?"Correction Needed - User Action":"Resolving",done:status.includes("correction")||status=="closed",active:true},
      {name: status=="closed"?"Closed":"Open",done:status=="closed"}
    ];
  }

  let html=`
  <div class="card">
    <h3>${type}: ${data.jobId||data.ticketId} <span class="badge ${statusClass}">${status.toUpperCase()}</span></h3>
    <p><b>Service:</b> ${data.pillar||""} ${data.sub||""} ${data.service||data.ticketType||data.route||""}</p>
    <p><b>Name:</b> ${data.name} | <b>Phone:</b> ${data.phone} | <b>Location:</b> ${data.location}</p>
    <p><b>Created:</b> ${createdTime} | <b>Admin Response Time:</b> ${responseTime}</p>
  </div>

  <div class="card">
    <b>📍 Steps - If open / closed / correction:</b>
  `;

  steps.forEach(s=>{
    let cls=s.done?"done":s.active?"active":"pending";
    let icon=s.done?"✅":s.active?"⏳":"⚪";
    html+=`<div class="step ${cls}">${icon} ${s.name}</div>`;
  });
  html+=`</div>`;

  if(adminMsg){
    html+=`<div class="card"><b>💬 Message from Admin:</b><div class="adminMsg">${adminMsg}<br><small>Response at: ${responseTime}</small></div></div>`;
  }

  // If correction required - UNLOCK TO END USER with correction message + resubmission button
  if(status.includes("correction") || status=="correction_needed" || correctionMsg){
    html+=`
    <div class="correctionBox">
      <h3 style="color:#ff5722">⚠️ Correction Required - Admin unlocked for you</h3>
      <p><b>Correction Message from Admin:</b></p>
      <div style="background:white;padding:10px;border-radius:6px;border:1px solid #ff5722">${correctionMsg||adminMsg||"Please correct your submission"}</div>
      <p><b>What to correct:</b> ${data.correctionFields||"Check details above"}</p>
      <br>
      <b>Resubmit Correction:</b><br>
      <textarea id="correctionDetails" placeholder="Enter corrected details *"></textarea>
      <input id="correctionPhone" placeholder="Correct phone if needed" value="${data.phone}">
      <input id="correctionLocation" placeholder="Correct location if needed" value="${data.location}">
      <button onclick="resubmitCorrection('${docId}','${colName}')" style="background:#ff5722;color:white;width:100%;margin-top:8px">🔄 RESUBMIT WITH CORRECTION</button>
      <small>After resubmission, status goes back to open, admin will re-review</small>
    </div>
    `;
  }

  html+=`
  <div class="card">
    <b>Details:</b><br>${data.details||""}<br><br>
    <b>Quantity:</b> ${data.qty||"-"} | <b>Budget:</b> ${data.budget||"-"} | <b>ID Number:</b> ${data.idNumber||"-"}<br>
    <b>User:</b> ${data.userEmail}
  </div>
  `;

  if(status=="closed"){
    html+=`<div class="card" style="background:#e8f5e9;border-left-color:#4caf50"><b>✅ Closed</b> - Service delivered / Ticket resolved at ${responseTime}</div>`;
  }

  card.innerHTML=html;
}

window.resubmitCorrection=async(docId,colName)=>{
  const details=document.getElementById("correctionDetails").value.trim();
  const phone=document.getElementById("correctionPhone").value.trim();
  const locationVal=document.getElementById("correctionLocation").value.trim();
  if(!details){ alert("Enter corrected details *"); return; }
  try{
    const ref=doc(db,colName,docId);
    await updateDoc(ref,{
      details:details,
      phone:phone,
      location:locationVal,
      status:"open",
      correctionMessage:"",
      adminMessage:`User resubmitted correction at ${new Date().toLocaleString()} - Previous correction: ${details}`,
      userResubmittedAt:serverTimestamp()
    });
    alert("✅ Correction resubmitted - Status back to open - Admin will respond");
    trackNow();
  }catch(e){ alert("Error: "+e.message); }
};

// Auto load from URL
window.addEventListener("DOMContentLoaded", ()=>{
  const params=new URLSearchParams(window.location.search);
  if(params.get("id")){ document.getElementById("trackId").value=params.get("id"); }
});
</script>
</body>
</html>
