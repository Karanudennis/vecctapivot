<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track</title><style>body{background:#0f172a;color:#fff;font-family:system-ui;padding:12px;max-width:600px;margin:auto}.card{background:#1e293b;padding:14px;border-radius:12px;border:1px solid #334155;margin:8px 0}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155;box-sizing:border-box}button{padding:12px;width:100%;border:none;border-radius:8px;font-weight:800;cursor:pointer}.btn-y{background:#facc15}.btn-b{background:#3b82f6;color:#fff}.tabs{display:flex;gap:6px}.tabs button{flex:1;background:#1e293b;color:#94a3b8}.tabs button.active{background:#facc15;color:#000}</style></head><body>
<div class="tabs"><button id="bJ" class="active" onclick="tab('job')">Track JOB</button><button id="bT" onclick="tab('ticket')">Track TICKET</button></div>
<div id="jobSec"><div class="card"><input id="jobInput" placeholder="JOB-XXXX"><button class="btn-y" onclick="trackJob()">Track JOB</button><div id="jobRes"></div></div></div>
<div id="ticketSec" style="display:none"><div class="card"><input id="ticketInput" placeholder="TICKET-XXXX"><button class="btn-b" onclick="trackTicket()">Track TICKET</button><div id="ticketRes"></div></div></div>
<script>
function getJobs(){return JSON.parse(localStorage.getItem('veccta_jobs')||localStorage.getItem('karanu_jobs')||'[]')}
function getTickets(){return JSON.parse(localStorage.getItem('veccta_tickets')||localStorage.getItem('karanu_tickets')||'[]')}
function tab(t){document.getElementById('jobSec').style.display=t=='job'?'block':'none';document.getElementById('ticketSec').style.display=t=='ticket'?'block':'none';bJ.classList.toggle('active',t=='job');bT.classList.toggle('active',t=='ticket');}
function trackJob(){
 let id=jobInput.value.trim(); let jobs=getJobs(); let j=jobs.find(x=>x.id===id);
 if(!j){jobRes.innerHTML=`<p style=color:#f87171>JOB ${id} NOT FOUND on this device. Submit JOB on same device or add backend.</p>`;return;}
 let tickets=getTickets().filter(t=>t.jobId===j.id);
 jobRes.innerHTML=`<div style="border-left:4px solid #facc15;padding:8px"><b style="color:#facc15;font-size:18px">${j.id}</b><br>Service: ${j.service}<br><b>PRICE: ${j.price? 'KSH '+j.price : 'Quote Pending'}</b><br>STATUS: <b>${j.status}</b><br>ADMIN: ${j.adminMessage}<br><small>${j.logged}</small><br><br><a href="ticket.html?job=${j.id}" style="background:#3b82f6;color:#fff;padding:8px 12px;border-radius:6px;text-decoration:none">Raise Ticket for this JOB</a></div><h4>Tickets: ${tickets.length}</h4>`+tickets.map(t=>`<div class=card> ${t.id} - ${t.status}<br>Q: ${t.message}<br>A: ${t.adminReply||'Waiting'}</div>`).join('');
}
function trackTicket(){
 let id=ticketInput.value.trim(); let t=getTickets().find(x=>x.id===id);
 if(!t){ticketRes.innerHTML='TICKET Not Found on this device';return;}
 ticketRes.innerHTML=`<div style="border-left:4px solid #3b82f6;padding:8px"><b style="color:#3b82f6">${t.id}</b><br>For: ${t.jobId} (${t.type})<br>STATUS: ${t.status}<br>Q: ${t.message}<br>A: ${t.adminReply||'Waiting admin'}<br><small>${t.logged}</small></div>`;
}
let q=new URLSearchParams(location.search); if(q.get('job')){jobInput.value=q.get('job'); trackJob();} if(q.get('ticket')){tab('ticket'); ticketInput.value=q.get('ticket'); trackTicket();}
</script></body></html>
