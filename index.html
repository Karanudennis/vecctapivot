<!DOCTYPE html>
<html lang="en-KE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vecctapivot Enterprises | Operations Marketplace Hub</title>
    <style>
        :root {
            --bg-obsidian: #030712;
            --panel-slate: #0b1329;
            --border-muted: rgba(255, 255, 255, 0.06);
            --gold-accent: #d4af37;
            --text-pure: #f3f4f6;
            --text-muted: #9ca3af;
            --action-blue: #1d4ed8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-pure);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Premium Header Area Layout */
        .portal-header {
            background: linear-gradient(135deg, #060b18 0%, var(--bg-obsidian) 100%);
            text-align: center;
            padding: 60px 24px;
            width: 100%;
            border-bottom: 1px solid var(--border-muted);
        }

        .welcome-container { 
            max-width: 850px; 
            margin: 0 auto; 
        }

        /* Brand Identity Header Infrastructure */
        .brand-identity-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        
        .corporate-logo {
            max-height: 80px;
            width: auto;
            margin-bottom: 10px;
        }

        .brand-text-fallback {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .brand-text-fallback span {
            color: var(--gold-accent);
        }

        .welcome-banner {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 6px;
            margin-bottom: 12px;
        }

        .portal-header h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 14px;
        }

        .tagline {
            font-size: 15px;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 20px;
        }

        .trust-badge {
            display: inline-block;
            background-color: rgba(212, 175, 55, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--gold-accent);
        }

        .philosophy-box {
            background-color: var(--panel-slate);
            border-left: 3px solid var(--gold-accent);
            border-radius: 4px;
            padding: 24px;
            margin-top: 30px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .philosophy-box h3 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .philosophy-box p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Keyword Directory Search Input Area Layout */
        .search-master-section {
            max-width: 850px;
            width: 100%;
            margin: 40px auto 10px auto;
            padding: 0 24px;
            text-align: center;
        }

        .search-master-section h3 {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .faq-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .search-bar-box input {
            width: 100%;
            padding: 16px 24px;
            background-color: var(--panel-slate);
            border: 1px solid var(--border-muted);
            border-radius: 30px;
            color: #ffffff;
            font-size: 14.5px;
            font-family: inherit;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .search-bar-box input:focus {
            outline: none;
            border-color: var(--gold-accent);
        }

        /* 7 Primary Grid Core Navigational Cards Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            padding: 40px 24px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .pillar-card {
            background-color: var(--panel-slate);
            border: 1px solid var(--border-muted);
            padding: 35px 24px;
            border-radius: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .pillar-card:hover {
            border-color: var(--gold-accent);
            transform: translateY(-2px);
        }

        .pillar-card .icon {
            font-size: 40px;
            margin-bottom: 14px;
        }

        .pillar-card h2 {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .pillar-card p {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
            flex: 1;
        }

        .explore-node-text {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--gold-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Accordion FAQ Layout Block */
        .faq-master-container {
            max-width: 850px;
            width: 100%;
            margin: 20px auto 60px auto;
            padding: 0 24px;
        }

        .faq-master-container h2 {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            margin-bottom: 6px;
        }

        .faq-item-card {
            background-color: var(--panel-slate);
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .faq-question-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .faq-question-row h4 {
            font-size: 14.5px;
            font-weight: 600;
            color: #ffffff;
            text-align: left;
        }

        .faq-arrow {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .faq-answer-content {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-muted);
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.6;
            text-align: left;
        }

        .hidden-faq { display: none !important; }

        /* Professional Stacked Mobile Footer Architecture Layout */
        .portal-footer {
            background-color: #090e1a;
            border-top: 1px solid var(--border-muted);
            padding: 60px 24px 40px 24px;
            font-size: 14px;
            width: 100%;
            margin-top: auto;
        }

        .footer-grid-row {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
            text-align: left;
        }

        @media(min-width: 769px) {
            .footer-grid-row {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        .footer-column {
            flex: 1;
        }

        .footer-column h4 {
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--gold-accent);
            padding-bottom: 4px;
            display: inline-block;
        }

        .footer-column p {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 6px 0;
            line-height: 1.5;
        }

        .footer-column strong {
            color: #ffffff;
        }

        .footer-bottom-legal-row {
            border-top: 1px solid var(--border-muted);
            padding-top: 25px;
            max-width: 900px;
            margin: 30px auto 0 auto;
            text-align: center;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .legal-footer {
            font-size: 11.5px;
            opacity: 0.6;
            line-height: 1.6;
            margin-top: 12px;
            text-align: justify;
        }

        @media(max-width: 768px) {
            .portal-header { padding: 50px 16px; }
            .portal-header h1 { font-size: 24px; }
            .grid-container { padding: 24px 16px; gap: 16px; }
            .footer-grid-row { gap: 30px; }
            .legal-footer { text-align: left; }
