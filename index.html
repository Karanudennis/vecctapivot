<!DOCTYPE html>
<html lang="en-KE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vecctapivot Enterprises | Operations Marketplace Hub</title>
    <style>
        :root {
            --bg-obsidian: #030712;
            --panel-slate: #0b1329;
            --border-muted: rgba(255, 255, 255, 0.06);
            --gold-accent: #d4af37;
            --text-pure: #f3f4f6;
            --text-muted: #9ca3af;
            --bg-deep-node: #060b18;
            --amber-warning: #FFB300;
            --action-blue: #1d4ed8;
            --success-green: #10b981;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; 
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-pure);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .urgency-ticker {
            background-color: var(--amber-warning); 
            color: #000000;
            text-align: center; 
            padding: 12px 20px; 
            font-size: 13px; 
            font-weight: 800; 
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            letter-spacing: 0.3px; 
            line-height: 1.4;
        }

        .portal-header {
            background: linear-gradient(135deg, #060b18 0%, var(--bg-obsidian) 100%);
            text-align: center;
            padding: 60px 24px;
            width: 100%;
            border-bottom: 1px solid var(--border-muted);
        }

        .welcome-container { max-width: 850px; margin: 0 auto; }

        .brand-text-fallback {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .brand-text-fallback span { color: var(--gold-accent); }
        
        .welcome-banner {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .portal-header h1 {
            font-size: 30px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 14px;
            color: var(--text-muted);
            font-style: italic;
        }

        .search-master-section {
            max-width: 850px;
            width: 100%;
            margin: 40px auto 10px auto;
            padding: 0 24px;
            text-align: center;
        }

        .search-bar-box input {
            width: 100%;
            padding: 16px 24px;
            background-color: var(--panel-slate);
            border: 1px solid var(--border-muted);
            border-radius: 30px;
            color: #ffffff;
            font-size: 14.5px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .search-bar-box input:focus {
            outline: none;
            border-color: var(--gold-accent);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.2);
        }

        .matrix-wrapper {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 24px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .core-pillar-block {
            background-color: var(--panel-slate);
            border: 1px solid var(--border-muted);
            border-radius: 12px;
            padding: 24px;
        }

        .core-pillar-block.hidden-node { display: none !important; }

        .pillar-title-row {
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .pillar-title-row .icon { font-size: 32px; }
        .pillar-title-row h2 { font-size: 22px; font-weight: 800; color: #ffffff; }

        .sub-pillars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .sub-pillar-card {
            background-color: var(--bg-deep-node);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            padding: 18px;
        }

        .sub-pillar-card.hidden-node { display: none !important; }

        .sub-pillar-card h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--gold-accent);
            margin-bottom: 14px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .sub-sub-actions-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sub-sub-actions-list li {
            font-size: 13px;
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .sub-sub-actions-list li.match-highlight {
            color: #000000;
            font-weight: 700;
            background-color: var(--gold-accent);
            border-color: var(--gold-accent);
        }

        /* Interactive Processing Operations Terminal Forms Section */
        .ingestion-master-terminal {
            max-width: 1400px;
            width: 100%;
            margin: 40px auto 60px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
        }

        .action-card-panel {
            background-color: var(--panel-slate);
            border: 1px solid var(--border-muted);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .action-card-panel h2 {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 14px;
            letter-spacing: 0.3px;
        }

        .action-card-panel p.section-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .form-element-block {
            margin-bottom: 18px;
        }

        .form-element-block label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-element-block select, 
        .form-element-block input[type="text"], 
        .form-element-block textarea {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-deep-node);
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
        }

        .form-element-block select:focus, 
        .form-element-block input:focus, 
        .form-element-block textarea:focus {
            outline: none;
            border-color: var(--gold-accent);
        }

        .upload-picker-container {
            background: rgba(255,255,255,0.01);
            border: 1px dashed var(--border-muted);
            padding: 20px;
            border-radius: 6px;
            text-align: center;
        }

        .upload-picker-container input[type="file"] {
            display: block;
            margin: 10px auto 0 auto;
            color: var(--text-muted);
            font-size: 13px;
        }

        .submission-trigger-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--gold-accent);
            color: #000000;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
        }

        .submission-trigger-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .ticket-trigger-btn {
            background-color: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #ffffff;
        }

        .ticket-trigger-btn:hover {
            background-color: rgba(255,255,255,0.05);
            border-color: #ffffff;
            box-shadow: none;
        }

        .hidden-element { display: none !important; }

        .telemetry-success-receipt {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid var(--success-green);
            border-radius: 6px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }

        .telemetry-success-receipt h4 {
            color: var(--success-green);
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .telemetry-success-receipt p {
            font-size: 13px;
            color: var(--text-pure);
            line-height: 1.5;
        }

        .telemetry-success-receipt strong {
            font-family: monospace;
            color: #ffffff;
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
