<!DOCTYPE html>
<html lang="en-KE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vecctapivot Enterprises | Operations Marketplace Hub</title>
    <style>
        :root {
            --bg-obsidian: #030712;
            --panel-slate: #0b1329;
            --border-muted: rgba(255, 255, 255, 0.06);
            --gold-accent: #d4af37;
            --text-pure: #f3f4f6;
            --text-muted: #9ca3af;
            --action-blue: #1d4ed8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; 
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-pure);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Institutional Corporate Header Panel Layout */
        .portal-header {
            background: linear-gradient(135deg, #060b18 0%, var(--bg-obsidian) 100%);
            text-align: center;
            padding: 80px 24px;
            width: 100%;
            border-bottom: 1px solid var(--border-muted);
            position: relative;
        }

        .welcome-container { 
            max-width: 850px; 
            margin: 0 auto; 
            position: relative; 
            z-index: 2; 
        }

        /* Premium Brand Identity Header Area Architecture */
        .brand-identity-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
        }
        
        .corporate-logo {
            max-height: 85px;
            width: auto;
            margin-bottom: 12px;
            object-fit: contain;
        }

        .brand-text-fallback {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .brand-text-fallback span {
            color: var(--gold-accent);
        }

        .welcome-banner {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-accent);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 6px;
            margin-bottom: 14px;
        }

        .portal-header h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.75px;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .tagline {
            font-size: 16px;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 24px;
        }

        .trust-badge {
            display: inline-block;
            background-color: rgba(212, 175, 55, 0.04);
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--gold-accent);
            letter-spacing: 0.3px;
        }

        .philosophy-box {
            background-color: var(--panel-slate);
            border-left: 3px solid var(--gold-accent);
            border-radius: 4px;
            padding: 26px;
            margin-top: 35px;
            text-align: left;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        }

        .philosophy-box h3 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .philosophy-box p {
            font-size: 14.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Real-Time Keyword Search Input Section */
        .search-master-section {
            max-width: 850px;
            width: 100%;
            margin: 50px auto 10px auto;
            padding: 0 24px;
            text-align: center;
        }

        .search-master-section h3 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .search-bar-box input {
            width: 100%;
            padding: 18px 26px;
            background-color: var(--panel-slate);
            border: 1px solid var(--border-muted);
            border-radius: 30px;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .search-bar-box input:focus {
            outline: none;
            border-color: var(--gold-accent);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }

        /* Navigational Desktop Grid Menu Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 28px;
            padding: 50px 24px;
            max-width: 1150px;
            margin: 0 auto;
            width: 100%;
        }

        .pillar-card {
            background-color: var(--panel-slate);
            border: 1px solid var(--border-muted);
            padding: 40px 26px;
            border-radius: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
        }

        .pillar-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold-accent);
            box-shadow: 0 16px 35px rgba(212, 175, 55, 0.08);
        }

        .pillar-card .icon {
            font-size: 44px;
            margin-bottom: 16px;
        }

        .pillar-card h2 {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.1px;
        }

        .pillar-card p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 24px;
            flex: 1;
        }

        .explore-node-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--gold-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* FAQ Content Styles Layout */
        .faq-master-container {
            max-width: 850px;
            width: 100%;
            margin: 20px auto 60px auto;
            padding: 0 24px;
        }

        .faq-master-container h2 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            margin-bottom: 8px;
        }

        .faq-item-card {
            background-color: var(--panel-slate);
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            padding: 22px;
            margin-bottom: 14px;
            cursor: pointer;
        }

        .faq-item-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .faq-question-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .faq-question-row h4 {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            text-align: left;
        }

        .faq-arrow {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .faq-answer-content {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-muted);
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            text-align: left;
        }

        .hidden-faq { display: none !important; }

        /* ==========================================================================
           PREMIUM INSTITUTIONAL FOOTER (TRUE SINGLE-COLUMN MOBILE RE-ARCHITECTURE)
           ========================================================================== */
        .portal-footer {
            background-color: #070b14;
            border-top: 1px solid var(--border-muted);
            padding: 60px 24px 40px 24px;
            font-size: 14px;
            width: 100%;
            margin-top: auto;
        }

        .footer-grid-row {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
            text-align: left;
        }

        @media(min-width: 769px) {
            .footer-grid-row {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        .footer-column {
            flex: 1;
        }

        .footer-column h4 {
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--gold-accent);
            padding-bottom: 4px;
            display: inline-block;
        }

        .footer-column p {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 6px 0;
            line-height: 1.5;
        }

        .footer-column strong {
            color: #ffffff;
        }

        .footer-bottom-legal-row {
            border-top: 1px solid var(--border-muted);
            padding-top: 25px;
            max-width: 900px;
            margin: 30px auto 0 auto;
