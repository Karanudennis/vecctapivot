<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VECCTA PIVOT - Book Service</title>
<style>
*{box-sizing:border-box}
body{background:#0a1930;color:#eef2fa;font-family:Inter,system-ui,Segoe UI,Arial;padding:18px;margin:0}
.box{max-width:600px;margin:30px auto;background:#121c30;border:1px solid #e6c36a33;border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h2{color:#e6c36a;text-align:center;margin:0 0 18px}
label{font-size:12px;color:#9aa6c2;margin:8px 0 4px;display:block}
input,select,textarea{width:100%;padding:14px;border-radius:10px;border:1px solid #2a395c;background:#0b1220;color:#fff;margin-bottom:12px;font-size:15px}
textarea{min-height:90px}
.btn{background:#e6c36a;color:#000;border:0;padding:14px;width:100%;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer}
.ok{display:none;margin-top:16px;background:#0b3d2a;border:1px solid #0ec27b;color:#8af7c5;padding:14px;border-radius:12px;line-height:1.7}
a{color:#25D366;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h2>Book Service - VECCTA PIVOT</h2>

<label>Full Name</label>
<input id="clientName" placeholder="Dennis Karanu Karanu">

<label>Phone</label>
<input id="phone" placeholder="0768309956" type="tel">

<label>Service</label>
<select id="service">
<option>BRS Name Reservation Ingestion</option>
<option>Business Registration</option>
<option>KRA Services</option>
<option>eCitizen Services</option>
<option>Transport & NTSA</option>
<option>Other Services</option>
</select>

<label>Details</label>
<textarea id="details" placeholder="Describe what you need..."></textarea>

<button class="btn" onclick="submitTicket()">Submit Ticket</button>
<div id="ok" class="ok"></div>
</div>

<script>
function submitTicket(){
 const name=document.getElementById('clientName').value.trim();
 const phoneRaw=document.getElementById('phone').value.trim();
 const service=document.getElementById('service').value;
 const details=document.getElementById('details').value.trim();
 if(!name){alert('Enter Full Name');return;}
 if(!phoneRaw){alert('Enter Phone');return;}

 let all=JSON.parse(localStorage.getItem('veccta_tickets')||'[]');
 let newId='VECCTA-'+all.length; // continues 6,7,8...

 let phone=phoneRaw.startsWith('+')?phoneRaw:'+254'+phoneRaw.replace(/^0/,'').replace(/\s/g,'');

 let ticket={
  id:newId,
  ticket:newId,
  clientName:name,
  name:name,
  phone:phone,
  service:service,
  details:details,
  status:'Logged',
  price:'',
  adminMessage:'',
  date:new Date().toISOString(),
  logged:new Date().toISOString()
 };

 all.push(ticket);
 localStorage.setItem('veccta_tickets',JSON.stringify(all));

 let ok=document.getElementById('ok');
 ok.style.display='block';
 ok.innerHTML=`
  ✅ <b>Ticket Saved!</b><br>
  ID: <b style="color:#e6c36a;font-size:20px">${newId}</b><br>
  Total tickets: ${all.length}<br><br>
  <a href="track.html?id=${newId}">→ Track ${newId}</a><br>
  <a href="admin.html">→ View in Admin</a><br>
  <a href="https://wa.me/254768309956?text=New ticket ${newId} from ${name} - ${service}" target="_blank">→ WhatsApp Admin</a>
 `;
 document.getElementById('clientName').value='';
 document.getElementById('phone').value='';
 document.getElementById('details').value='';
 console.log('SAVED OK',ticket);
}
</script>
</body>
</html>
