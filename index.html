<!DOCTYPE html>
<html lang="en-KE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vecctapivot Enterprises | Operations Marketplace Hub</title>
    <style>
        :root {
            --bg-obsidian: #030712;
            --panel-slate: #0b1329;
            --border-muted: rgba(255, 255, 255, 0.06);
            --gold-accent: #d4af37;
            --text-pure: #f3f4f6;
            --text-muted: #9ca3af;
            --bg-deep-node: #060b18;
            --amber-warning: #FFB300;
            --success-green: #10b981;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease, background-color 0.2s ease; 
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-pure);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Urgencies Ribbon Ticker Layout Options */
        .urgency-ticker {
            background-color: var(--amber-warning); 
            color: #000000;
            text-align: center; 
            padding: 12px 20px; 
            font-size: 13px; 
            font-weight: 800; 
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            letter-spacing: 0.3px; 
            z-index: 10;
        }

        /* Institutional Corporate Header Panel Layout */
        .portal-header {
            background: linear-gradient(135deg, #060b18 0%, var(--bg-obsidian) 100%);
            text-align: center;
            padding: 60px 24px 40px 24px;
            width: 100%;
            border-bottom: 1px solid var(--border-muted);
            position: relative;
        }

        .welcome-container { max-width: 850px; margin: 0 auto; }
        .brand-text-fallback { font-size: 24px; font-weight: 900; letter-spacing: 2px; color: #ffffff; text-transform: uppercase; margin-bottom: 4px; text-shadow: 0 0 20px rgba(255,255,255,0.05); }
        .brand-text-fallback span { color: var(--gold-accent); }
        .welcome-banner { font-size: 11px; font-weight: 700; color: var(--gold-accent); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 20px; }
        .portal-header h1 { font-size: 34px; font-weight: 800; color: #ffffff; margin-bottom: 10px; letter-spacing: -0.5px; }
        .tagline { font-size: 14.5px; color: var(--text-muted); font-style: italic; }

        /* Dynamic Progress Matrix Map Indicators */
        .matrix-breadcrumb-bar {
            max-width: 1200px;
            width: 100%;
            margin: 30px auto 10px auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .crumb-item {
            color: var(--text-muted);
            padding: 6px 14px;
            background: var(--panel-slate);
            border: 1px solid var(--border-muted);
            border-radius: 20px;
            font-weight: 600;
        }

        .crumb-item.active-layer {
            color: #000000;
            background: var(--gold-accent);
            border-color: var(--gold-accent);
        }

        /* Premium Multidimensional Grid View Layout */
        .dashboard-matrix-view {
            max-width: 1200px;
            width: 100%;
            margin: 10px auto 40px auto;
            padding: 0 24px;
            flex: 1;
        }

        .matrix-stage-panel {
            background-color: var(--panel-slate);
            border: 1px solid var(--border-muted);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .matrix-stage-panel h3 {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 14px;
        }

        /* System Grid Layout Blocks Buttons */
        .matrix-buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .matrix-clickable-node {
            background-color: var(--bg-deep-node);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            padding: 24px;
            text-align: left;
            cursor: pointer;
            width: 100%;
            color: inherit;
            font-family: inherit;
        }

        .matrix-clickable-node:hover {
            border-color: var(--gold-accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.08);
        }

        .matrix-clickable-node h4 {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .matrix-clickable-node p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .action-node-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 12px;
            display: block;
        }

        /* Ingestion Desk Workspace Forms Layout */
        .ingestion-console-section {
            max-width: 1200px;
            width: 100%;
            margin: 20px auto 60px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
        }

        .action-card-panel {
            background-color: var(--panel-slate);
            border: 1px solid var(--border-muted);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .action-card-panel h2 { font-size: 20px; font-weight: 800; color: #ffffff; margin-bottom: 6px; border-bottom: 1px solid var(--border-muted); padding-bottom: 14px; }
        .action-card-panel p.section-desc { font-size: 13.5px; color: var(--text-muted); margin-bottom: 20px; }
        .form-element-block { margin-bottom: 18px; }
        .form-element-block label { display: block; font-size: 13px; font-weight: 700; color: #ffffff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-element-block input[type="text"], .form-element-block textarea { width: 100%; padding: 14px; background-color: var(--bg-deep-node); border: 1px solid var(--border-muted); border-radius: 6px; color: #ffffff; font-size: 14px; font-family: inherit; }
        
        .upload-picker-container { background: rgba(255,255,255,0.01); border: 1px dashed var(--border-muted); padding: 18px; border-radius: 6px; text-align: center; }
        .upload-picker-container input[type="file"] { display: block; margin: 8px auto 0 auto; color: var(--text-muted); }

        .submission-trigger-btn { width: 100%; padding: 16px; background-color: var(--gold-accent); color: #000000; border: none; border-radius: 6px; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .submission-trigger-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3); }
        .ticket-trigger-btn { background-color: transparent; border: 1px solid rgba(255,255,255,0.2); color: #ffffff; margin-top: 15px; }
        .ticket-trigger-btn:hover { background-color: rgba(255,255,255,0.05); }

        .hidden-element { display: none !important; }
        .telemetry-success-receipt { background: rgba(16, 185, 129, 0.05); border: 1px solid var(--success-green); border-radius: 6px; padding: 20px; margin-top: 20px; }
        .telemetry-success-receipt h4 { color: var(--success-green); margin-bottom: 6px; font-weight: 800; }
        .telemetry-success-receipt strong { font-family: monospace; color: #ffffff; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }

        /* Professional Stacked Mobile Footer Architecture Layout */
        .portal-footer {
            background-color: #090e1a;
            border-top: 1px solid var(--border-muted);
            padding: 40px 24px;
            font-size: 13.5px;
            text-align: center;
            color: var(--text-muted);
            margin-top: auto;
        }
        .footer-branding { font-weight: 700; color: #ffffff; margin-bottom: 4px; letter-spacing: 0.5px; }
    </style>
</head>
