    <script>
        // Check if a ticket exists but allow users to dismiss it safely
        window.addEventListener('DOMContentLoaded', () => {
            const activeSessionTicket = localStorage.getItem('vp_active_ticket');
            if (activeSessionTicket) {
                const modalId = document.getElementById('generated-ticket-id');
                if (modalId) modalId.innerText = activeSessionTicket;
                const modalOverlay = document.getElementById('success-ticket-modal');
                if (modalOverlay) modalOverlay.classList.remove('hidden-popup');
            }
        });

        // Safe anchor scroll function with zero script-blocking dependencies
        function activatePillarDesk(workspaceBlockId) {
            // Hide all 7 workspace blocks first to prevent page layout clashes
            document.querySelectorAll('.desk-form-block').forEach(block => {
                block.classList.add('hidden-popup');
            });

            // Smoothly reveal the targeted desk panel container
            const targetContainer = document.getElementById(workspaceBlockId);
            if (targetContainer) {
                targetContainer.classList.remove('hidden-popup');
                document.getElementById('master-intake-section').classList.remove('hidden-popup');
                document.getElementById('master-intake-section').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function activateCentralHelpDesk() {
            activatePillarDesk('p6-workspace');
            const p6Select = document.querySelector('#p6-workspace select');
            if (p6Select) p6Select.selectedIndex = 3; 
        }

        // Submits the filled dataset safely with automated random tracking index assignment
        function executeLockedFormSubmission(event, prefixCode) {
            event.preventDefault();

            const form = event.target;
            const button = form.querySelector('.submit-ticket-btn');
            
            if (button) {
                button.disabled = true;
                button.innerText = "🔒 Securing Portal Queue Slot...";
                button.style.backgroundColor = "#475569";
            }

            const randomCode = Math.floor(100000 + Math.random() * 900000);
            const centralTicketID = "VP-" + prefixCode + "-" + randomCode;

            const ticketField = form.querySelector('.form-ticket-field-node');
            if (ticketField) ticketField.value = centralTicketID;
            
            const modalTicketId = document.getElementById('generated-ticket-id');
            if (modalTicketId) modalTicketId.innerText = centralTicketID;

            fetch(form.action, {
                method: form.method,
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    localStorage.setItem('vp_active_ticket', centralTicketID);
                    document.getElementById('success-ticket-modal').classList.remove('hidden-popup');
                    form.reset();
                } else {
                    alert("Communications system timeout error. Check network bars and retry.");
                    if (button) {
                        button.disabled = false;
                        button.innerText = "🚀 Submit Requirements & Lock Ticket Position";
                        button.style.backgroundColor = "var(--primary-navy)";
                    }
                }
            });
        }

        // Real-Time search keyword filtering mechanics
        function filterMarketplaceSearch() {
            const query = document.getElementById('marketplace-search').value.toLowerCase();
            const cards = document.querySelectorAll('.searchable-card');
            
            cards.forEach(card => {
                const tags = card.getAttribute('data-tags');
                if (tags && tags.includes(query)) {
                    card.style.display = "";
                } else {
                    card.style.display = "none";
                }
            });
        }

        function toggleFaqAnswer(answerId) {
            const currentAnswer = document.getElementById(answerId);
            if (currentAnswer) currentAnswer.classList.toggle('hidden-faq');
        }

        // Added critical safety logic: Clicking close clears the device block completely
        function closeTicketModal() {
            document.getElementById('success-ticket-modal').classList.add('hidden-popup');
            localStorage.removeItem('vp_active_ticket'); // Completely releases your phone from the loop!
        }
    </script>
