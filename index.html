<!DOCTYPE html>
<html lang="en-KE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vecctapivot Enterprises | Operations Marketplace Hub</title>
    <style>
        :root {
            --bg-obsidian: #030712;
            --panel-slate: #0b1329;
            --border-muted: rgba(255, 255, 255, 0.06);
            --gold-accent: #d4af37;
            --text-pure: #f3f4f6;
            --text-muted: #9ca3af;
            --action-blue: #1d4ed8;
            --wa-green: #25D366;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; 
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-pure);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Urgency Ticker */
        .urgency-ticker {
            background-color: #060b18;
            border-bottom: 1px solid var(--border-muted);
            padding: 12px 20px;
            text-align: center;
        }
        .urgency-ticker p { font-size: 13px; color: var(--gold-accent); font-weight: 500; }

        /* Institutional Corporate Header Panel Layout */
        .portal-header {
            background: linear-gradient(135deg, #060b18 0%, var(--bg-obsidian) 100%);
            text-align: center;
            padding: 60px 24px;
            border-bottom: 1px solid var(--border-muted);
        }
        .welcome-container { max-width: 850px; margin: 0 auto; }
        .brand-identity-block { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 24px; }
        .corporate-logo { max-height: 80px; width: auto; margin-bottom: 10px; }
        .brand-text-fallback { font-size: 22px; font-weight: 900; letter-spacing: 1.5px; color: #ffffff; text-transform: uppercase; }
        .brand-text-fallback span { color: var(--gold-accent); }
        .welcome-banner { font-size: 11px; font-weight: 700; color: var(--gold-accent); letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; margin-bottom: 12px; }
        .portal-header h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; color: #ffffff; line-height: 1.2; margin-bottom: 14px; }
        .tagline { font-size: 15px; color: var(--text-muted); font-style: italic; margin-bottom: 20px; }
        .trust-badge { display: inline-block; background-color: rgba(212, 175, 55, 0.04); border: 1px solid rgba(212, 175, 55, 0.15); padding: 6px 16px; border-radius: 30px; font-size: 12.5px; font-weight: 600; color: var(--gold-accent); }
        
        .philosophy-box {
            background-color: var(--panel-slate); border-left: 3px solid var(--gold-accent); border-radius: 4px;
            padding: 24px; margin-top: 30px; text-align: left; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .philosophy-box h3 { font-size: 14px; font-weight: 700; color: #ffffff; text-transform: uppercase; margin-bottom: 8px; }
        .philosophy-box p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

        /* Keyword Filter Search Directory Section */
        .search-master-section { max-width: 850px; width: 100%; margin: 40px auto 10px auto; padding: 0 24px; text-align: center; }
        .search-master-section h3 { font-size: 17px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
        .search-bar-box input { width: 100%; padding: 16px 24px; background-color: var(--panel-slate); border: 1px solid var(--border-muted); border-radius: 30px; color: #ffffff; font-size: 14.5px; }
        .search-bar-box input:focus { outline: none; border-color: var(--gold-accent); }

        /* The 7 Primary Dashboard Grid Menu Layout */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; padding: 40px 24px; max-width: 1100px; margin: 0 auto; width: 100%; }
        .pillar-card { background-color: var(--panel-slate); border: 1px solid var(--border-muted); padding: 35px 24px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
        .pillar-card:hover { border-color: var(--gold-accent); transform: translateY(-2px); }
        .pillar-card .icon { font-size: 40px; margin-bottom: 14px; }
        .pillar-card h2 { font-size: 17px; font-weight: 700; color: #ffffff; margin-bottom: 10px; }
        .pillar-card p { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; flex: 1; }
        .explore-node-text { font-size: 11.5px; font-weight: 700; color: var(--gold-accent); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Cascading Multi-Page Workspace Container Panels */
        .workspace-view-panel { max-width: 900px; width: 100%; margin: 20px auto; padding: 0 24px; display: none; }
        .back-nav-bar { margin-bottom: 30px; }
        .back-link { color: var(--gold-accent); text-decoration: none; font-size: 14px; font-weight: 700; cursor: pointer; }
        
        .solution-row-card { background-color: var(--panel-slate); border: 1px solid var(--border-muted); border-radius: 6px; padding: 24px; margin-bottom: 20px; }
        .solution-row-card h3 { font-size: 16px; font-weight: 700; color: #ffffff; margin-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px; }
        .parameter-line { margin-bottom: 10px; font-size: 14px; line-height: 1.5; text-align: left; }
        .parameter-line span.label-tag { font-size: 11px; font-weight: 700; color: var(--gold-accent); text-transform: uppercase; letter-spacing: 0.5px; display: inline-block; margin-right: 6px; }
        .parameter-line a.direct-link { color: var(--text-pure); font-weight: 600; text-decoration: underline; }

        /* Unified Form Requisition Terminal Block Layout */
        .secure-form-card { background-color: var(--panel-slate); border: 1px solid var(--border-muted); border-radius: 8px; padding: 40px; margin-top: 50px; }
        .form-title-area h3 { font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 6px; text-align: left; }
        .form-title-area p { font-size: 13.5px; color: var(--text-muted); margin-bottom: 30px; text-align: left; }
        .input-group-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; text-align: left; }
        .input-group-row label { font-size: 12.5px; font-weight: 600; color: #ffffff; }
        .input-group-row input, .input-group-row select, .input-group-row textarea { width: 100%; padding: 14px; background-color: var(--bg-obsidian); border: 1px solid var(--border-muted); border-radius: 4px; color: #ffffff; font-size: 14px; font-family: inherit; }
        .input-group-row input:focus, .input-group-row select:focus, .input-group-row textarea:focus { outline: none; border-color: var(--gold-accent); }
        .file-picker-container { background-color: rgba(255, 255, 255, 0.02); border: 1px dashed var(--border-muted); padding: 16px; border-radius: 4px; font-size: 13px; color: var(--text-muted); }
        .privacy-protocol-banner { border-left: 2px solid #10b981; background-color: rgba(16, 185, 129, 0.02); padding: 16px; margin: 24px 0; font-size: 12.5px; color: var(--text-muted); line-height: 1.5; text-align: left; }
        .submit-action-btn { background-color: var(--action-blue); color: #ffffff; border: none; padding: 16px; border-radius: 4px; font-weight: 700; font-size: 14.5px; text-transform: uppercase; width: 100%; cursor: pointer; }

        /* Professional Stacked Mobile Footer Architecture Layout */
        .portal-footer { background-color: #090e1a; border-top: 1px solid var(--border-muted); padding: 60px 24px 40px 24px; font-size: 14px; width: 100%; margin-top: auto; }
        .footer-grid-row { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; text-align: left; }
        @media(min-width: 769px) { .footer-grid-row { flex-direction: row; justify-content: space-between; } }
        .footer-column { flex: 1; }
        .footer-column h4 { color: #ffffff; font-size: 12.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; border-bottom: 2px solid var(--gold-accent); padding-bottom: 4px; display: inline-block; }
        .footer-column p { font-size: 13.5px; color: var(--text-muted); margin: 6px 0; line-height: 1.5; }
        .footer-column strong { color: #ffffff; }
        .footer-bottom-legal-row { border-top: 1px solid var(--border-muted); padding-top: 25px; max-width: 900px; margin: 30px auto 0 auto; text-align: center; font-size: 12.5px; color: var(--text-muted); }
        .legal-footer { font-size: 11.5px; opacity: 0.6; line-height: 1.6; margin-top: 12px; text-align: justify; }

        @media(max-width: 768px) { .footer-grid-row { gap: 30px; } .legal-footer { text-align: left; } }
    </style>
</head>
<body>

    <div class="urgency-ticker">
        <p>📋 Operations Live: Secure portal processing, cross-border agricultural logistics routing, and independent proxy audits active below.</p>
    </div>

    <!-- MAIN HUB ROOT GRID - SHOWN BY DEFAULT -->
    <div id="main-landing-view">
        <header class="portal-header">
            <div class="welcome-container">
                
                    <img src="logo.png" alt="Vecctapivot Logo" class="corporate-logo" onerror="this.style.display='none'">
                    <div class="brand-text-fallback">Vecctapivot <span>Enterprises</span></div>
                    <div class="welcome-banner">Central Operations Gateway</div>
                </div>
