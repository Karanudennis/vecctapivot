<!DOCTYPE html>
<html>
<head><title>VECCTA Test</title></head>
<body style="font-family:sans-serif; padding:40px; background:#f5f5f5">
<h2>🔥 VECCTA Firebase Test</h2>
<input id="email" placeholder="your email" style="padding:12px; width:260px;"><br><br>
<input id="password" type="password" placeholder="password (6+ chars)" style="padding:12px; width:260px;"><br><br>
<button id="btn" style="padding:12px 25px; background:black; color:white; border:none; cursor:pointer;">Sign Up - Create First User</button>
<p id="msg" style="margin-top:20px; font-weight:bold;"></p>

<script type="module">
import { auth } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
document.getElementById("btn").onclick = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    await createUserWithEmailAndPassword(auth, email, password);
    document.getElementById("msg").innerText = "✅ SUCCESS! Go check Firebase Users table!";
  } catch(e) {
    document.getElementById("msg").innerText = "❌ " + e.message;
  }
};
</script>
</body>
</html>
