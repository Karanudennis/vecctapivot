<!DOCTYPE html>
<html>
<head><title>VECCTA Login</title></head>
<body style="font-family:sans-serif; padding:40px; background:#f5f5f5; text-align:center">
<h2>🔥 VECCTA - Login</h2>
<p>You already have an account: denniskmuthoni@gmail.com</p>
<input id="email" placeholder="email" value="denniskmuthoni@gmail.com" style="padding:12px; width:260px;"><br><br>
<input id="password" type="password" placeholder="password" style="padding:12px; width:260px;"><br><br>
<button id="loginBtn" style="padding:12px 25px; background:black; color:white; border:none; cursor:pointer; margin:5px;">Log In</button>
<button id="signupBtn" style="padding:12px 25px; background:white; color:black; border:1px solid black; cursor:pointer; margin:5px;">Sign Up New User</button>
<p id="msg" style="margin-top:20px; font-weight:bold;"></p>

<script type="module">
import { auth } from "./firebase.js";
import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById("msg").innerText = "✅ LOGGED IN! Welcome to VECCTA, Dennis!";
  } catch(e) {
    document.getElementById("msg").innerText = "❌ " + e.message;
  }
};

document.getElementById("signupBtn").onclick = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    await createUserWithEmailAndPassword(auth, email, password);
    document.getElementById("msg").innerText = "✅ NEW USER CREATED!";
  } catch(e) {
    document.getElementById("msg").innerText = "❌ " + e.message;
  }
};
</script>
</body>
</html>
