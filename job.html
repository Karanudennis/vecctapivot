<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request Job - VECCTAPIVOT</title>
<style>
body{background:#0f172a;color:#fff;font-family:system-ui;padding:16px;max-width:600px;margin:auto}
.card{background:#1e293b;padding:18px;border-radius:12px;border:1px solid #334155;margin:10px 0}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;background:#0f172a;color:#fff;border:1px solid #334155;box-sizing:border-box}
button{padding:14px;border:none;border-radius:8px;font-weight:800;cursor:pointer;width:100%}
.btn-y{background:#facc15;color:#0f172a} 
label{font-size:13px;color:#94a3b8;margin-top:8px;display:block}
</style>
</head><body>
<h3 style="color:#facc15;text-align:center">Request a Job</h3>
<div class="card">
<label>Full Name</label>
<input id="cName" placeholder="Your Name">
<label>Phone / WhatsApp</label>
<input id="cPhone" placeholder="07XX...">
<label>Email (optional)</label>
<input id="cEmail" placeholder="email">
<label>Service Pillar</label>
<select id="pillar">
<option>Digital & Brand Systems</option>
<option>Academic & Testing Logistics</option>
<option>Transport Brokerage Hub</option>
<option>Merchandise Sourcing Links</option>
<option>Independent Fixer Desk</option>
<option>General Agency Core</option>
<option>Statutory & Portal Logistics</option>
</select>
<label>Exact Service</label>
<input id="service" placeholder="e.g. BRS BN Registration, Passport">
<label>Priority</label>
<select id="priority"><option>Standard</option><option>Express</option><option>Priority</option></select>
<label>Details / Deadline</label>
<textarea id="details" rows="3" placeholder="Describe job, documents you have, deadline..."></textarea>
<button class="btn-y" onclick="createJob()">Submit Job Request</button>
<div id="result"></div>
</div>

<script>
function createJob(){
 let name=document.getElementById('cName').value.trim();
 let phone=document.getElementById('cPhone').value.trim();
 let service=document.getElementById('service').value.trim();
 if(!name||!phone||!service){alert('Name, Phone, Service required');return;}

 let id='JOB-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(1000+Math.random()*9000);
 
 let job={
  id:id,
  clientName:name,
  clientPhone:phone,
  clientEmail:document.getElementById('cEmail').value,
  pillar:document.getElementById('pillar').value,
  service:service,
  priority:document.getElementById('priority').value,
  details:document.getElementById('details').value,
  price:'', // ADMIN WILL FILL - shown as Quote Pending
  adminMessage:'Received. Admin will review and update price/status shortly.',
  status:'Logged',
  logged:new Date().toLocaleString()
 };

 let jobs=JSON.parse(localStorage.getItem('veccta_jobs')||'[]');
 jobs.push(job);
 localStorage.setItem('veccta_jobs',JSON.stringify(jobs));

 document.getElementById('result').innerHTML=`<div class=card style="border-left:4px solid #facc15;text-align:center"><b style="color:#facc15;font-size:20px">${id}</b><br>Job Logged!<br><br><a href="track.html?job=${id}" style="background:#facc15;color:#000;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:800">Track Now</a> <a href="https://wa.me/254788099685?text=${id} - ${name}" style="color:#25D366;font-weight:700;margin-left:10px">WhatsApp</a></div>`;
}
</script>
</body></html>
