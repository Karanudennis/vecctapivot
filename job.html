<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a Job - VECCTA PIVOT</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#08162f;color:#eef2fa;font-family:Inter,Arial;min-height:100vh}
.nav{background:#0a1930;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a2a4a}
.nav b{color:#e6c36a}.nav a{color:#9aa6c2;text-decoration:none;margin-left:14px;font-size:14px}
.wrap{max-width:600px;margin:20px auto;padding:20px}
.card{background:linear-gradient(180deg,#142447,#0f1d39);border:1px solid #e6c36a33;border-radius:18px;padding:24px}
h1{color:#e6c36a;text-align:center;font-size:22px;margin-bottom:4px}.sub{color:#9aa6c2;text-align:center;font-size:13px;margin-bottom:18px}
label{color:#c8d2e8;font-size:11px;font-weight:800;letter-spacing:.8px;margin-top:12px;display:block;text-transform:uppercase}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #2a395c;background:#0b1220;color:#fff;margin-top:6px;font-size:14px}
.btn{width:100%;background:linear-gradient(180deg,#f0d27a,#e6c36a);color:#1a1300;border:0;padding:14px;border-radius:12px;font-weight:900;margin-top:18px;cursor:pointer;font-size:16px}
.success{background:#0b3d2a;border:1px solid #1f8a5e;color:#8af7c5;padding:14px;border-radius:12px;margin-top:16px;display:none;text-align:center}
.success b{color:#e6c36a;font-size:20px;display:block;margin:6px 0}
</style></head><body>
<div class="nav"><b>VECCTA PIVOT</b><div><a href="index.html">Book a Job</a><a href="track.html">Track</a><a href="admin.html">Admin</a></div></div>
<div class="wrap"><div class="card">
<h1>Book a New Job</h1><p class="sub">JOB tracking - colors first</p>

<label>Client Full Name *</label><input id="client" placeholder="Dennis Karanu Karanu">

<label>Phone *</label><input id="phone" placeholder="0768309956">

<label>Service Area *</label><select id="area"><option>BRS</option><option>KRA</option><option>eCitizen</option><option>Immigration</option><option>NTSA</option><option>Other</option></select>

<label>Service *</label><select id="service"><option>BRS Name Reservation Ingestion</option><option>Business Registration</option><option>Company Registration</option><option>KRA PIN Registration</option><option>Tax Compliance</option><option>Other</option></select>

<label>Priority</label><select id="priority"><option>STANDARD</option><option>URGENT</option><option>EXPRESS</option></select>

<label>Details / Business Name</label><textarea id="details" placeholder="Business name, etc"></textarea>

<label>Price (KSh) *</label><input id="price" type="number" placeholder="2500" value="2500">

<button class="btn" onclick="bookJob()">Book Job Now → Generate JOB ID</button>

<div class="success" id="success">
✓ Job Booked Successfully!
<b id="newId">JOB-20260911-6938</b>
<div style="font-size:13px">Price: <span id="newPrice">KSh 2500</span> | <span id="newStatus">Booked</span></div>
<div style="margin-top:10px"><a id="trackLink" href="track.html" style="color:#e6c36a;font-weight:800">Track Now →</a> | <a href="admin.html" style="color:#9aa6c2">Go to Admin</a></div>
</div>

</div></div>
<script>
function getAll(){try{return JSON.parse(localStorage.getItem('veccta_tickets')||'[]')}catch{return[]}}
function saveAll(a){localStorage.setItem('veccta_tickets',JSON.stringify(a))}
function bookJob(){
 let client=document.getElementById('client').value.trim();
 let phone=document.getElementById('phone').value.trim();
 let area=document.getElementById('area').value;
 let service=document.getElementById('service').value;
 let priority=document.getElementById('priority').value;
 let details=document.getElementById('details').value.trim();
 let price=document.getElementById('price').value.trim()||'2500';
 if(!client||!phone){alert('Enter Client Name and Phone');return}
 let now=new Date();let dStr=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0');
 let rand=Math.floor(1000+Math.random()*9000);
 let jobId=`JOB-${dStr}-${rand}`;
 let ticket={id:jobId,ticket:jobId,clientName:client,name:client,phone:phone,serviceArea:area,area:area,service:service,priority:priority,details:details,uploads:'ID Copy, KRA PIN expected',price:price,status:'Booked',adminMessage:'Job booked - payment pending confirmation',date:now.toLocaleString(),logged:now.toLocaleString(),email:'Sent to vecctapivotenterprises@gmail.com'};
 let all=getAll();all.push(ticket);saveAll(all);
 document.getElementById('newId').textContent=jobId;
 document.getElementById('newPrice').textContent='KSh '+price;
 document.getElementById('newStatus').textContent='Booked';
 document.getElementById('trackLink').href='track.html?id='+jobId;
 document.getElementById('success').style.display='block';
 document.getElementById('client').value='';document.getElementById('phone').value='';document.getElementById('details').value='';
 window.scrollTo(0,document.body.scrollHeight);
}
</script></body></html>
