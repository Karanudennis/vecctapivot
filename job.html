<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Job — VECCTAPIVOT</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css"><style>.wrap{max-width:760px;margin:18px auto;padding:0 14px}.form{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:22px}.h{color:#facc15;text-align:center}.label{font-size:11px;font-weight:800;color:#facc15;text-transform:uppercase;margin:12px 0 6px;display:block}.input,.select,.textarea{width:100%;padding:13px;border-radius:12px;background:#0f172a;color:#fff;border:1px solid #334155;box-sizing:border-box}.btn{width:100%;padding:14px;background:#facc15;color:#000;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:14px}.kbd{font-size:22px;color:#facc15;font-weight:900;font-family:monospace}</style></head><body>
<div class="utility"><div class="uwrap"><span class="uitem"><span class="ubadge">GLOBAL LIVE</span></span><span class="uitem">49 services · Any Phone</span></div></div>
<header class="top"><div class="navrow"><a class="brand" href="index.html"><img src="logo.png"><span class="brandname">Vecctapivot<em>Global Desk</em></span></a><div class="navcta"><a class="btn line sm2" href="track.html">Track</a><a class="btn gold sm2" href="index.html">Home</a></div></div></header>
<main class="wrap"><div class="form"><h2 class="h">Request Job — GLOBAL</h2>
<input id="cName" class="input" placeholder="Full Name *"><input id="cPhone" class="input" placeholder="Phone 07... *">
<label class="label">Pillar (7)</label><select id="pillar" class="select"></select>
<label class="label">Service</label><select id="service" class="select"></select>
<label class="label">Sub-Service</label><select id="sub" class="select"></select>
<input id="req" class="input" placeholder="Specific details"><textarea id="details" class="textarea" rows=3 placeholder="More details"></textarea>
<button id="btn" class="btn" onclick="submitGlobal()">🚀 SUBMIT TO CLOUD (Any Phone Visible)</button><div id="res"></div></div></main>
<script type="module">
import { db } from './firebase.js';
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const DATA={"Digital & Brand Systems":{"BRS Registry Filing":["BN Registration","Private Ltd","LLP","CR12","Search","Annual Returns","Change"],"Brand Identity Pack":["Logo","Manual","Cards","Flyer","Social Kit","Mockups","Rebrand"],"Secure Document Vault":["Scan","Vault","Share","Access","Backup","Retrieval","Audit"],"Web & Systems":["Website","Ecom","System","Domain","Payments","SEO","Maintenance"],"Creative Production":["Poster","Brochure","Motion","Video","Photo","Writing","Voice"],"Digital Marketing":["Social Mgmt","Google Ads","Meta Ads","Email","WhatsApp","Influencer","Analytics"],"Escrow & Ledger":["Escrow","Milestone","Tracking","Receipt","Recon","Dispute","Release"]},"Academic & Testing Logistics":{"Mock Archives":["Primary","JSS","Senior","College","KASNEB","Guides","Schemes"],"Revision Booklets":["CBC","CBE","KCSE","College","Topical","Notes","Bank"],"KASNEB Vault":["ATD","CS","CPA","CIFA","Papers","Texts","Kits"],"CBC Distribution":["G1-6","G7-9","Assessment","Teacher","Workbooks","Bulk","County"],"Academic Support":["Assignment","Research","Thesis","Classes","Tutor","Proofread","Plagiarism"],"Testing & Certification":["PTE","IELTS","TOEFL","KASNEB","Driver Test","Computer","Pro Certs"],"School Logistics":["Uniform","Books","Lab","Furniture","Transport","Feeding","Fee"]},"Transport Brokerage Hub":{"Executive Rides":["Airport","Corporate","Wedding","SGR","Town","Upcountry","Hourly"],"Courier Runs":["Same Day","Overnight","Doc","Parcel","Ecom","Medical","Bulk"],"Cargo Freight":["Pickup","Canter","5T","10T","Trailer","Container","Cold"],"Transit Insurance":["Cargo","Transit","Vehicle","Goods","Marine","Claim","Risk"],"Vehicle Sourcing":["Toyota","Mazda","Honda","Budget","Import","Inspection","Logbook"],"Movers & Relocation":["1BR","2BR","3BR+","Office","Inter-County","Storage","Packing"],"Fleet Management":["Tracking","Fuel","Driver","Maintenance","Route","Compliance","Escrow"]},"Merchandise Sourcing Links":{"Farm-Gate Produce":["Maize","Potatoes","Onions","Fruits","Veg","Dairy","Export"],"Factory Price Audits":["Verify","Price Audit","MOQ","Sample","QC","Quote","Compare"],"Supplier Vetting":["KYC","Background","Site Visit","Capacity","Ref","Blacklist","Vetted"],"Import Links":["China","Turkey","Dubai","Clearance","Shipping","Consolid","Duty"],"Export Links":["Docs","KEBS","KPHIS","Pack","Buyer","Escrow","Logistics"],"Retail Bulk Supply":["Shop","Supermarket","Hotel","School","Hospital","Hardware","Bulk"],"Market Linkage":["Research","Buyer-Seller","Commission","Escrow","Proof","Dispute","Repeat"]},"Independent Fixer Desk":{"Site Inspections":["Land","House","Construction","Factory","Shop","School","Photo/Video"],"Permit Queues":["County","NEMA","Construction","Business","Health","Fire","Queue"],"Dispute Resolution":["Land Dispute","Tenant","Supplier","Boundary","Witness","Chiefs","Docs"],"Ground Proxy":["Collection","Delivery","Office Visit","Bank Queue","School Visit","Hospital","Court"],"Verification Services":["ID","Address","Employee","Tenant","Asset","Business","Next of Kin"],"Due Diligence":["Land Search","Company Search","Vehicle Search","Background","Title","Compliance","Report"],"Emergency Fixer":["Urgent Doc","Urgent Permit","Urgent Inspection","After Hours","Weekend","Remote","Crisis"]},"General Agency Core":{"Cross-Sector Retainers":["Business","Personal","Corporate","Startup","Family","Monthly","Priority"],"Unified Ledgers":["Income","Expense","Service","Client","Supplier","Tax","Recon"],"Priority Queues":["VIP","Same Day","Express","Weekend","After Hours","Multi","Escalation"],"Escrow Services":["Service Escrow","Goods","Land","Vehicle","Milestone","Dispute Hold","Receipt"],"Consultation":["Business","Career","Legal","Tax","Investment","Import/Export","Startup"],"Documentation":["Affidavit","Agreement","Business Plan","Company Profile","Proposal","Letter","Certification"],"Agency Subcontracting":["Sourcing","Quotation","Supervision","Quality","Payment","Completion","Ledger"]},"Statutory & Portal Logistics":{"eCitizen Services":["Good Conduct","Business Search","DL Renewal","Marriage","Land Search","BRELA","Help"],"Passports & Immigration":["New Passport","Renewal","Lost","Immigration Status","Appointment","Checklist","Collection"],"NTSA TIMS":["Logbook Search","Transfer","DL Check","PSV","Inspection Booking","Number Plate","TIMS Account"],"SHA/SHIF & Health":["SHA Reg","SHIF Pay","Means Testing","Facility","Claim","Card Collection","Dependent"],"KRA iTax":["PIN","Nil Returns","Employment","Business","TCC","Compliance","Recovery"],"ArdhiSasa & Lands":["Land Search","Stamp Duty","Transfer","Account","Green Card","Map Request","Consent"],"DCI & Statutory Docs":["Police Clearance","Lost Doc","OB","Certification","Commissioner","Huduma","Declaration"]}};
const pillar=document.getElementById('pillar'), service=document.getElementById('service'), sub=document.getElementById('sub');
function onP(){service.innerHTML=Object.keys(DATA[pillar.value]).map(k=>`<option>${k}</option>`).join(''); onS()}
function onS(){sub.innerHTML=(DATA[pillar.value][service.value]||["General"]).map(x=>`<option>${x}</option>`).join('')}
pillar.onchange=onP; service.onchange=onS;
pillar.innerHTML=Object.keys(DATA).map(k=>`<option>${k}</option>`).join(''); onP();
window.submitGlobal=async()=>{
 if(!cName.value||!cPhone.value){alert('Name phone required');return}
 btn.textContent='⏳ Saving to cloud...'; btn.disabled=true;
 let id='JOB-'+Date.now().toString().slice(-6);
 let payload={id,clientName:cName.value,clientPhone:cPhone.value,pillar:pillar.value,service:service.value,subService:sub.value,fullService:`${pillar.value} > ${service.value} > ${sub.value}`,detail:req.value,details:details.value,price:'',status:'Logged',adminMessage:'Received - quoting 1hr',revisionNote:'',revisionReply:'',logged:new Date().toLocaleString(),createdAt:serverTimestamp()};
 try{await addDoc(collection(db,'jobs'),payload); let local=JSON.parse(localStorage.getItem('veccta_jobs')||'[]'); local.push(payload); localStorage.setItem('veccta_jobs',JSON.stringify(local)); res.innerHTML=`<div style="background:#052e16;border:1px solid #22c55e;padding:14px;border-radius:12px;text-align:center"><b style="color:#22c55e">✅ SAVED TO CLOUD — VISIBLE ANYWHERE</b><br><span class=kbd>${id}</span><br>${payload.fullService}<br><a href="track.html?job=${id}" style="background:#facc15;color:#000;padding:10px 14px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:8px;font-weight:800">TRACK NOW</a><br><small>Open admin.html from ANY device - will show</small></div>`}catch(e){res.innerHTML=`<div style="background:#450a0a;padding:10px;border-radius:10px">❌ ${e.message}<br>Go to Firebase Console > Firestore > Rules > set allow read, write: if true;</div>`}
 btn.textContent='🚀 SUBMIT TO CLOUD (Any Phone Visible)'; btn.disabled=false;
}
</script></body></html>
