<!DOCTYPE html>
<html>
<head>
<title>Request Job - VECCTA Pivot Enterprises</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:15px}
.box{background:white;padding:20px;border-radius:10px;max-width:500px;margin:20px auto;box-shadow:0 2px 8px rgba(0,0,0,.1)}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;background:black;color:#ffcc00;border:none;border-radius:6px;font-weight:bold;font-size:16px;cursor:pointer}
.top{background:black;color:#ffcc00;padding:12px;border-radius:8px;text-align:center;margin-bottom:15px}
</style>
</head>
<body>
<div class="top"><b>VECCTA PIVOT ENTERPRISES</b><br><small>Request a Service - Any Phone</small></div>

<div class="box">
  <h3>📝 Request a Job</h3>
  <p id="userInfo" style="font-size:12px;color:gray">Checking login...</p>
  
  <label>Service Needed</label>
  <select id="service">
    <option>KRA PIN / Returns</option>
    <option>eCitizen Services</option>
    <option>NTSA TIMS</option>
    <option>Passport Application</option>
    <option>Good Conduct</option>
    <option>HELB Application</option>
    <option>KUCCPS</option>
    <option>Business Registration</option>
    <option>Other Cyber Service</option>
  </select>

  <label>Your Phone (M-Pesa / WhatsApp)</label>
  <input id="phone" type="tel" placeholder="07xxxxxxxx">

  <label>Details</label>
  <textarea id="details" rows="4" placeholder="Explain what you need... e.g. KRA returns for 2023, 2024"></textarea>

  <button id="submitJob">Submit Job Request</button>
  <p id="msg" style="text-align:center;margin-top:10px;font-weight:bold"></p>
  
  <p style="text-align:center;font-size:12px;margin-top:15px">
    <a href="./dashboard.html">Go to Dashboard</a> | <a href="./index.html">Home</a>
  </p>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 1. Check if logged in - if not, force to test-login.html (your rule: sign up only when requesting)
onAuthStateChanged(auth, (user)=>{
  if(!user){
    window.location.href="./test-login.html";
    return;
  }
  document.getElementById("userInfo").innerText = "Logged in as: " + user.email;
});

document.getElementById("submitJob").onclick = async ()=>{
  const service = document.getElementById("service").value;
  const details = document.getElementById("details").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const user = auth.currentUser;
  
  if(!user){ window.location.href="./test-login.html"; return; }
  if(!phone || !details){
    document.getElementById("msg").innerText = "❌ Add phone & details";
    document.getElementById("msg").style.color="red";
    return;
  }
  
  document.getElementById("msg").innerText = "⏳ Sending to admin...";
  document.getElementById("msg").style.color="orange";
  
  try{
    await addDoc(collection(db, "jobs"), {
      email: user.email,
      uid: user.uid,
      phone: phone,
      service: service,
      details: details,
      status: "new",
      createdAt: serverTimestamp()
    });
    document.getElementById("msg").innerText = "✅ Job Received! Admin will WhatsApp you on " + phone;
    document.getElementById("msg").style.color="green";
    document.getElementById("details").value="";
  }catch(e){
    document.getElementById("msg").innerText = "❌ " + e.message + " - Enable Firestore in Firebase Console";
    document.getElementById("msg").style.color="red";
  }
};
</script>
</body>
</html>
