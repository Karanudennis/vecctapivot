<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEC 7x7x7 - No Display Till Chosen</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#f1f5f9}
.top{background:#0f172a;color:#fff;padding:16px;text-align:center}
.box{background:#fff;max-width:680px;margin:16px auto;padding:20px;border-radius:16px}
label{font-size:11px;font-weight:800;margin-top:12px;display:block}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:10px;margin-top:5px}
.hidden{display:none!important}
.step{border:1px solid #e2e8f0;padding:14px;border-radius:12px;margin-top:12px;background:#f8fafc}
.btn{width:100%;padding:14px;background:#0f172a;color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:14px;cursor:pointer}
</style></head><body>
<div class="top"><b>7x7x7 JOB - NO DISPLAY TILL CHOSEN</b><p style="font-size:10px;color:#94a3b8">Select one → Next appears</p></div>
<div class="box">

<!-- STEP 1: Always visible -->
<div class="step" id="step1">
<b>STEP 1: Client Info</b>
<label>Name *</label><input id="name" oninput="checkStep1()">
<label>Phone *</label><input id="phone" oninput="checkStep1()">
<p id="msg1" style="font-size:10px;color:#64748b;margin-top:6px">Enter Name + Phone to unlock Pillar</p>
</div>

<!-- STEP 2: Hidden till Step1 done -->
<div class="step hidden" id="stepPillar">
<b>STEP 2: Choose Pillar (7 Options)</b>
<select id="pillar" onchange="onPillar()"><option value="">-- Choose Pillar --</option></select>
</div>

<!-- STEP 3: Hidden till Pillar chosen -->
<div class="step hidden" id="stepSub">
<b>STEP 3: Choose Sub-Pillar (7 per Pillar)</b>
<select id="sub" onchange="onSub()"><option value="">-- Choose Sub --</option></select>
<div id="subInfo" style="font-size:10px;color:#64748b;margin-top:6px"></div>
</div>

<!-- STEP 4: Hidden till Sub chosen -->
<div class="step hidden" id="stepService">
<b>STEP 4: Choose Service (7 per Sub = 343 total)</b>
<select id="service" onchange="onService()"><option value="">-- Choose Service --</option></select>
<div id="price" style="margin-top:8px;background:#fef3c7;padding:10px;border-radius:8px;font-size:12px;display:none"></div>
</div>

<!-- STEP 5: Hidden till Service chosen -->
<div class="step hidden" id="stepDetails">
<b>STEP 5: Job Details - Only shows after Service chosen</b>
<label>Job Title *</label><input id="title">
<label>Description *</label><textarea id="desc" rows="4" placeholder="Now describe job..."></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div><label>Qty</label><input id="qty" type="number" value="1"></div>
<div><label>Urgency</label><select id="urg"><option>Normal</option><option>Fast (+200)</option><option>Express (+500)</option></select></div>
</div>
<button class="btn" id="btn" onclick="createJob()">🚀 CREATE JOB - SAVE TO CLOUD</button>
<div id="suc" style="display:none;background:#065f46;color:#fff;padding:14px;border-radius:10px;margin-top:12px">
<h3 id="jid"></h3><p id="jinfo" style="font-size:11px;margin-top:6px"></p>
<button onclick="location.href='track.html?job='+lastId" style="padding:8px 12px;background:#fbbf24;border:none;border-radius:6px;font-weight:700;margin-top:8px">Track Now</button>
</div>
</div>

<p id="err" style="color:red;font-size:11px;text-align:center;margin-top:8px"></p>
</div>

<script>
const firebaseConfig={apiKey:"PUT YOURS",authDomain:"PUT YOURS",projectId:"PUT YOURS",storageBucket:"PUT YOURS",messagingSenderId:"PUT YOURS",appId:"PUT YOURS"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();

const DATA={
"1. Academic & Testing Logistics":{"Revision Materials":["College Booklets","Highschool Booklets","Primary Booklets","University Notes","Past Papers","Mock Exams","Study Guides"],"Exam Registration":["KNEC Registration","University Exam","College Exam","KCSE Private","KCPE Private","Professional Exams","International Exams"],"Transcripts":["College Transcript","University Transcript","Certificate Replacement","Result Slip","Attestation","Verification","Translation"],"Research":["Research Proposal","Full Research","Data Analysis","Plagiarism Check","Editing","Formatting","Publishing"],"Tutoring":["Online Tutoring","Physical Tutoring","Group Classes","One-on-One","Holiday Tuition","Exam Prep","Homework Help"],"Applications":["University Application","College Application","Highschool Placement","Scholarship Application","Transfer Letter","Admission Letter","Course Change"],"Library":["E-Books","Hardcopy Books","Library Card","Research Access","Journal Access","Printing","Binding"]},
"2. KRA Services":{"KRA Pin":["New Pin","Pin Retrieval","Pin Update","Pin Correction","Company Pin","Group Pin","Foreign Pin"],"Returns":["Nil Returns","Employment Returns","Business Returns","Rental Returns","VAT Returns","PAYE Returns","Withholding Returns"],"Compliance":["Compliance Cert","Compliance Check","Penalty Waiver","Ledger Clean","Payment Plan","Objection","Appeal"],"Accounts":["iTax Account","Password Reset","Email Update","Phone Update","Ledger Access","Statement","Account Unlock"],"Business Tax":["Business Registration","Turnover Tax","VAT Registration","Excise License","Income Tax","Stamp Duty","Capital Gains"],"Customs":["Import Duty","Export Process","Customs Clearance","Exemption Letter","Valuation","Classification","Customs Appeal"],"Advisory":["Tax Consultation","Tax Planning","Audit Support","Bookkeeping","Financial Statements","Tax Training","Business Advisory"]},
"3. Government Services":{"ID & Passport":["ID Application","ID Replacement","ID Correction","Passport New","Passport Renewal","Passport Lost","Maisha Card"],"Birth & Death":["Birth Certificate","Birth Correction","Death Certificate","Late Registration","Amendment","Replacement","Verification"],"Lands":["Title Search","Title Transfer","Land Rates","Consent","Valuation","Survey","Subdivision"],"Business Reg":["Business Name","Company Registration","Permit","License Renewal","CR12","Annual Returns","Deregistration"],"Legal":["Good Conduct","HELB Clearance","E-Citizen","Affidavit","Commissioner Oath","Police Abstract","Court Filing"],"NHIF & NSSF":["NHIF Registration","NHIF Payment","NHIF Card","NSSF Registration","NSSF Statement","NSSF Claim","Compliance"],"Huduma":["Huduma Booking","Verification","Certification","Notarization","Attestation","Apostille","Translation"]},
"4. CV & Jobs":{"CV Writing":["Professional CV","Entry CV","Executive CV","Academic CV","Cover Letter","LinkedIn Profile","CV Review"],"Job Search":["Job Listing","Application Letter","Email Application","Portal Application","Follow-up","Interview Invite","Offer Negotiation"],"Interview Prep":["Mock Interview","Common Questions","Dress Code","Presentation","Salary Negotiation","Confidence Coaching","Feedback"],"Career Services":["Career Coaching","Career Change","Skills Assessment","Job Market Analysis","Networking","Mentorship","Portfolio"],"LinkedIn":["Profile Optimization","Connection Strategy","Content Creation","Job Alerts","Recruiter Outreach","Recommendations","Analytics"],"Training":["Computer Packages","Software Training","Soft Skills","Communication","Leadership","Customer Service","Entrepreneurship"],"Freelance":["Upwork Profile","Fiverr Gig","Freelance Proposal","Contract Writing","Invoicing","Payment Setup","Profile Review"]},
"5. Design & Printing":{"Graphic Design":["Logo Design","Poster Design","Banner Design","Business Card","Flyer","Brochure","Branding"],"Printing":["Bulk Printing","Color Printing","B&W Printing","Large Format","T-Shirt Printing","Mug Printing","ID Card Printing"],"Digital Design":["Social Media Design","Web Banner","Email Template","Presentation Design","Infographic","3D Mockup","Animation"],"Branding":["Brand Identity","Brand Guidelines","Brand Strategy","Brand Audit","Rebranding","Naming","Tagline"],"Publishing":["Book Layout","Book Cover","Book Publishing","Magazine Design","Newspaper Ad","Catalog Design","Annual Report"],"Photo & Video":["Photo Editing","Video Editing","Photography","Videography","Drone Shots","Live Streaming","Documentary"],"Signage":["Signboard Design","Signboard Printing","Vehicle Branding","Office Branding","Exhibition Stand","Roll-up Banner","3D Signage"]},
"6. Tech Services":{"Website":["Website Design","Website Redesign","E-commerce Site","Blog Setup","Portfolio Site","Landing Page","Maintenance"],"Systems":["Management System","POS System","School System","Hospital System","Inventory System","HR System","Custom Software"],"Mobile Apps":["Android App","iOS App","Hybrid App","App Update","App Bug Fix","Playstore Upload","App Marketing"],"Digital Marketing":["Social Media Marketing","SEO","Google Ads","Facebook Ads","Email Marketing","Content Marketing","Analytics"],"IT Support":["Computer Repair","Network Setup","Software Installation","Virus Removal","Data Recovery","Backup","IT Consultation"],"Hosting & Domain":["Domain Registration","Web Hosting","Email Hosting","SSL Certificate","Domain Transfer","Hosting Migration","Cpanel Setup"],"Training Tech":["Coding Classes","Web Dev Training","App Dev Training","Digital Marketing Training","Graphics Training","Video Editing Training","IT Certification"]},
"7. Business Services":{"Business Plan":["Business Plan Writing","Financial Projection","Market Research","Feasibility Study","Pitch Deck","Investor Proposal","Grant Proposal"],"Accounting":["Bookkeeping","Financial Statements","Payroll","Invoicing","Expense Tracking","Bank Reconciliation","Audit"],"Marketing":["Marketing Plan","Brand Strategy","Social Media Plan","Promotion Strategy","Customer Survey","Competitor Analysis","Campaign"],"Legal":["Contract Drafting","MOU Drafting","Legal Advice","Company Policy","Terms & Conditions","Privacy Policy","Compliance"],"Consulting":["Business Consulting","Startup Consulting","Growth Strategy","Operations","HR Consulting","Sales Consulting","Management Consulting"],"Logistics":["Courier Services","Delivery","Supply Chain","Procurement","Inventory","Warehousing","Distribution"],"Training Biz":["Entrepreneurship Training","Sales Training","Customer Service Training","Leadership Training","Team Building","Financial Literacy","Business Workshop"]}
};

// Load Pillars
let pSel=document.getElementById('pillar');
Object.keys(DATA).forEach(k=>{let o=document.createElement('option'); o.value=k; o.textContent=k; pSel.appendChild(o);});

function checkStep1(){
 let n=document.getElementById('name').value.trim();
 let ph=document.getElementById('phone').value.trim();
 if(n.length>=3 && ph.length>=8){
   document.getElementById('stepPillar').classList.remove('hidden');
   document.getElementById('msg1').innerText='✅ Unlocked Pillar';
 }else{
   document.getElementById('stepPillar').classList.add('hidden');
   document.getElementById('stepSub').classList.add('hidden');
   document.getElementById('stepService').classList.add('hidden');
   document.getElementById('stepDetails').classList.add('hidden');
 }
}

function onPillar(){
 let pillar=document.getElementById('pillar').value;
 let subSel=document.getElementById('sub');
 subSel.innerHTML='<option value="">-- Choose Sub --</option>';
 document.getElementById('stepService').classList.add('hidden');
 document.getElementById('stepDetails').classList.add('hidden');
 if(!pillar) {document.getElementById('stepSub').classList.add('hidden'); return;}
 Object.keys(DATA[pillar]).forEach(k=>{let o=document.createElement('option'); o.value=k; o.textContent=k; subSel.appendChild(o);});
 document.getElementById('stepSub').classList.remove('hidden');
 document.getElementById('subInfo').innerText='7 Sub-Pillars under '+pillar+' - Choose one to unlock Services';
}

function onSub(){
 let pillar=document.getElementById('pillar').value;
 let sub=document.getElementById('sub').value;
 let serSel=document.getElementById('service');
 serSel.innerHTML='<option value="">-- Choose Service --</option>';
 document.getElementById('stepDetails').classList.add('hidden');
 if(!sub){document.getElementById('stepService').classList.add('hidden'); return;}
 DATA[pillar][sub].forEach(k=>{let o=document.createElement('option'); o.value=k; o.textContent=k; serSel.appendChild(o);});
 document.getElementById('stepService').classList.remove('hidden');
 document.getElementById('price').style.display='none';
}

function onService(){
 let s=document.getElementById('service').value;
 if(!s){document.getElementById('stepDetails').classList.add('hidden'); return;}
 document.getElementById('price').style.display='block';
 document.getElementById('price').innerHTML=`<b>${s}</b> - Price: KES ${500+Math.floor(Math.random()*1500)}<br><small>${document.getElementById('pillar').value} > ${document.getElementById('sub').value}</small>`;
 document.getElementById('stepDetails').classList.remove('hidden');
}

let lastId=null;
async function createJob(){
 let name=document.getElementById('name').value.trim();
 let phone=document.getElementById('phone').value.trim();
 let pillar=document.getElementById('pillar').value;
 let sub=document.getElementById('sub').value;
 let service=document.getElementById('service').value;
 let title=document.getElementById('title').value.trim();
 let desc=document.getElementById('desc').value.trim();
 if(!name||!phone||!pillar||!sub||!service||!title||!desc){document.getElementById('err').innerText='Fill all *'; return;}
 let btn=document.getElementById('btn'); btn.innerText='⏳ SAVING...'; btn.disabled=true;
 let jobId="VEC-JOB-"+Math.floor(10000+Math.random()*90000);
 let data={trackingId:jobId,ticket:jobId,id:jobId,clientName:name,phone:phone,pillar:pillar,subPillar:sub,service:service,title:title,description:desc,qty:document.getElementById('qty').value,urgency:document.getElementById('urg').value,status:'queue',adminMessage:'',system:'7x7x7 no-display-till-chosen',createdAt:firebase.firestore.FieldValue.serverTimestamp()};
 try{
  await db.collection("jobs").doc(jobId).set(data);
  await db.collection("tickets").doc(jobId).set(data);
  lastId=jobId;
  document.getElementById('suc').style.display='block';
  document.getElementById('jid').innerText=jobId+' SAVED';
  document.getElementById('jinfo').innerText=pillar+' > '+sub+' > '+service+' | '+title;
  btn.innerText='✅ SAVED';
  btn.disabled=false;
 }catch(e){btn.innerText='🚀 CREATE JOB'; btn.disabled=false; document.getElementById('err').innerText=e.message; alert(e.message+' Rules: allow read,write:true');}
}
</script></body></html>
