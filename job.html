<main class="wrap"><div class="form"><h2 class="h">Request Job — GLOBAL CLOUD</h2><p class="sub">7 Pillars × 7 Services × 7 Subs — visible from any phone</p>

<label class="label">Pillar (7)</label><select id="pillar" class="select"></select>
<label class="label">Service (7 per pillar)</label><select id="service" class="select"></select>
<label class="label">Sub-Service (7 per service)</label><select id="sub" class="select"></select>
<input id="req" class="input" placeholder="Specific details"><textarea id="details" class="textarea" rows=3 placeholder="More details"></textarea>
<button id="btn" class="btn" onclick="submitGlobal()">🚀 SUBMIT TO CLOUD</button><div id="res"></div>
<p style="font-size:11px;color:#64748b;text-align:center;margin-top:8px">Saves to Firebase vecctapivot — admin sees from any device instantly</p>
</div></main>
<script type="module">
import { db } from './firebase.js';
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const DATA={"Digital & Brand Systems":{"BRS Registry Filing":["BN Registration","Private Ltd","LLP","CR12","Business Search","Annual Returns","Change of Officials"],"Brand Identity Pack":["Logo Design","Brand Manual","Business Cards","Flyer Design","Social Media Kit","Mockups","Rebrand"],"Secure Document Vault":["Digitization","Vault Setup","Encrypted Share","Access Control","Backup","Retrieval","Audit Log"],"Web & Systems":["Website Dev","E-commerce","Custom System","Domain & Hosting","Payments Integration","SEO","Maintenance"],"Creative Production":["Poster","Brochure","Motion Graphics","Video Edit","Photography","Copywriting","Voice Over"],"Digital Marketing":["Social Management","Google Ads","Meta Ads","Email Marketing","WhatsApp Marketing","Influencer","Analytics"],"Escrow & Ledger":["Escrow Setup","Milestone Ledger","Tracking","Receipt Vault","Reconciliation","Dispute","Release"]},"Academic & Testing Logistics":{"Mock Archives":["Primary Mocks","JSS Mocks","Senior School Mocks","College Mocks","KASNEB Mocks","Guides","Schemes"],"Revision Booklets":["CBC Revision","CBE Revision","KCSE Revision","College Revision","Topical","Quick Notes","Question Bank"],"KASNEB Vault":["ATD","CS","CPA","CIFA","Past Papers","Study Texts","Revision Kits"],"CBC Distribution":["Grade 1-6 Materials","Grade 7-9 Materials","Assessment Tools","Teacher Resources","Workbooks","Bulk Supply","County Delivery"],"Academic Support":["Assignment Help","Research Project","Thesis","Online Classes","Tutoring","Proofreading","Plagiarism Check"],"Testing & Certification":["PTE Booking","IELTS Booking","TOEFL","KASNEB Booking","Driving Test","Computer Packages","Professional Certs"],"School Logistics":["Uniform Supply","Books Supply","Lab Equipment","Furniture","Transport Link","Feeding Program","Fee Ledger"]},"Transport Brokerage Hub":{"Executive Rides":["Airport Transfer","Corporate Ride","Wedding Ride","SGR Transfer","Town Service","Upcountry","Hourly Hire"],"Courier Runs":["Same Day","Overnight" const pillar=document.getElementById('pillar'), service=document.getElementById('service'), sub=document.getElementById('sub');
function onP(){service.innerHTML=Object.keys(DATA[pillar.value]).map(k=>`<option>${k}</option>`).join(''); onS()}
function onS(){sub.innerHTML=(DATA[pillar.value][service.value]||["General"]).map(x=>`<option>${x}</option>`).join('')}
pillar.onchange=onP; service.onchange=onS;
pillar.innerHTML=Object.keys(DATA).map(k=>`<option>${k}</option>`).join(''); onP();
window.submitGlobal=async()=>{
 if(!cName.value.trim()||!cPhone.value.trim()){alert('Name & phone required');return}
 btn.textContent='⏳ Saving to cloud...'; btn.disabled=true;
 let id='JOB-'+Date.now().toString().slice(-6);
 let payload={id,clientName:cName.value.trim(),clientPhone:cPhone.value.trim(),pillar:pillar.value,service:service.value,subService:sub.value,fullService:`${pillar.value} > ${service.value} > ${sub.value}`,detail:req.value,details:details.value,price:'',status:'Logged',adminMessage:'Received - quoting within 1hr',revisionNote:'',revisionReply:'',logged:new Date().toLocaleString(),createdAt:serverTimestamp()};
 try{await addDoc(collection(db,'jobs'),payload); res.innerHTML=`<div style="background:#052e16;border:1px solid #22c55e;padding:14px;border-radius:12px;text-align:center;margin-top:12px"><b style="color:#22c55e">✅ SAVED TO CLOUD — VISIBLE ANYWHERE</b><br><span class=kbd>${id}</span><br>${payload.fullService}<br><a href="track.html?job=${id}" style="background:#facc15;color:#000;padding:10px 14px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:8px;font-weight:800">TRACK NOW →</a><br><small style="color:#94a3b8">Open admin.html from ANY device — will show</small></div>`}catch(e){res.innerHTML=`<div style="background:#450a0a;padding:10px;border-radius:10px">❌ ${e.message}<br>Firebase Rules must be allow read, write: if true;</div>`}

}
</script></body></html>
